<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TKM Market — Sepetim</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="tkm-core.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 50% 0%, #1d294d 0%, #0b0f1d 58%, #070a14 100%);
      color: #f8fafc; min-height: 100vh; padding: 14px 14px 86px;
    }
    .container { max-width: 560px; margin: 0 auto; }
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 14px; border-radius: 14px; background: #141b30;
      border: 1px solid rgba(148,163,184,.16); margin-bottom: 12px;
    }
    .topbar a { color: #93c5fd; text-decoration: none; font-weight: 800; font-size: 13px; }
    .card {
      background: #141b30; border: 1px solid rgba(148,163,184,.16);
      border-radius: 16px; padding: 16px; margin-bottom: 12px;
    }
    .row {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      padding: 11px 0; border-bottom: 1px solid rgba(148,163,184,.14); font-size: 13px;
    }
    .row:last-child { border-bottom: none; }
    .btn-buy {
      background: #2563eb; color: #fff; border: none; border-radius: 8px;
      padding: 7px 11px; font-size: 12px; font-weight: 800; cursor: pointer;
    }
    .btn-del {
      background: rgba(239,68,68,.15); color: #f87171; border: 1px solid rgba(239,68,68,.3);
      border-radius: 8px; padding: 7px 9px; font-size: 12px; font-weight: 800; cursor: pointer;
    }
    .msg { font-size: 12px; font-weight: 700; margin-top: 8px; }
    .ok { color: #4ade80; } .err { color: #f87171; }
    .muted { font-size: 12px; color: #94a3b8; }
    .bottom-nav {
      position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr);
      background: rgba(15, 21, 38, 0.97); border-top: 1px solid rgba(148,163,184,.16); padding: 8px 4px;
    }
    .bottom-nav a { text-decoration: none; color: #94a3b8; text-align: center; font-size: 11px; font-weight: 700; }
    .bottom-nav a.active { color: #60a5fa; }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <a href="profil.html">← Profil Menüsü</a>
      <a href="siparislerim.html">Siparişlerim →</a>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <strong>Sepetim</strong>
        <span id="balBadge" style="color:#4ade80;font-weight:800;font-size:13px;">0.00 TMT</span>
      </div>
      <div id="box"><div class="muted">Yükleniyor...</div></div>
      <div class="msg" id="msg"></div>
    </div>
  </div>
  <nav class="bottom-nav">
    <a href="index.html">Ana Sayfa</a>
    <a href="index.html#ilan-pazari">İlan Pazarı</a>
    <a href="index.html#kategoriler">Kategoriler</a>
    <a href="bakiye-yatir.html">Cüzdan</a>
    <a href="profil.html" class="active">Profil</a>
  </nav>
  <script>
    let currentItems = [];
    async function loadCart() {
      const u = await tkmRequireSession(true);
      if (!u) return;
      const prof = await tkmGetOrCreateProfile(u);
      document.getElementById("balBadge").textContent = tkmFmtTmt(prof?.balance_tmt);
      const { data } = await tkmSb.from("cart_items").select("*").eq("user_id", u.id).order("created_at", { ascending: false });
      currentItems = data || [];
      const box = document.getElementById("box");
      if (!currentItems.length) {
        box.innerHTML = `<div class="muted">Sepetinizde henüz ürün bulunmuyor. <a href="index.html" style="color:#93c5fd;">İlan Pazarı'na git</a></div>`;
        return;
      }
      box.innerHTML = currentItems.map((c, idx) => `
        <div class="row">
          <div><strong>${c.item_title}</strong><div class="muted">${tkmFmtTmt(c.price_tmt)}</div></div>
          <div style="display:flex;gap:6px;">
            <button type="button" class="btn-buy" onclick="checkoutItem(${idx})">Sipariş Ver</button>
            <button type="button" class="btn-del" onclick="removeItem('${c.id}')">Sil</button>
          </div>
        </div>`).join("");
    }

    async function checkoutItem(idx) {
      const item = currentItems[idx];
      const msg = document.getElementById("msg");
      const res = await tkmBuyFromCartItem(item);
      if (!res.ok) { msg.className = "msg err"; msg.textContent = res.error; return; }
      msg.className = "msg ok";
      msg.textContent = "Sipariş oluşturuldu! Siparişlerim sayfasına eklendi.";
      loadCart();
    }

    async function removeItem(id) {
      await tkmRemoveFromCart(id);
      loadCart();
    }

    loadCart();
  </script>
</body>
</html>
