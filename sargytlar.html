<!DOCTYPE html>
<html lang="tk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pul Çek & Emanet — TKM Market</title>
  <link rel="stylesheet" href="assets/tkm.css" />
</head>
<body>
  <div id="playerok-shell"></div>

  <main class="page-wrap">
    <div class="panel">
      <h2>Pul Çek (Satyjy Gazanjy)</h2>
      <p class="muted">İki tarapyň hem tassyklan emanet sargytlaryndan gelen serişdäni çekip bilersiňiz.</p>

      <div class="form-grid">
        <div class="list-row" style="margin-top:0;">
          <div>
            <div class="muted">Çekip Bolýan Bakiýe</div>
            <strong id="available-balance" style="font-size:18px; color:#34d399;">0 TMT</strong>
          </div>
        </div>
        <div class="list-row" style="margin-top:0;">
          <div>
            <div class="muted">Emanetde Saklanýan</div>
            <strong id="escrow-balance" style="font-size:18px; color:#fbbf24;">0 TMT</strong>
          </div>
        </div>
      </div>

      <form id="withdraw-form" style="margin-top:12px;">
        <div class="form-grid">
          <div class="field">
            <label>Satyjy Ady</label>
            <input id="w-seller" type="text" placeholder="Serkanbey77" />
          </div>
          <div class="field">
            <label>Çekjek Möçberiňiz (TMT)</label>
            <input id="w-amount" type="number" min="1" step="0.01" placeholder="100" required />
          </div>
          <div class="field">
            <label>Çekiş Usuly</label>
            <select id="w-method">
              <option value="USDT BEP20">USDT BEP20</option>
              <option value="Visa">Visa</option>
              <option value="Mastercard">Mastercard</option>
            </select>
          </div>
          <div class="field">
            <label>Karta / Gapjyňyz (BEP20 Adresi ýa-da Karta)</label>
            <input id="w-target" type="text" placeholder="0x... ýa-da 4111 ••••" required />
          </div>
        </div>

        <div class="btn-row">
          <button class="btn btn-main" type="submit">Pul Çekmek İsledigini Iber</button>
        </div>
      </form>

      <div id="withdrawals-list" style="margin-top:14px;"></div>
    </div>

    <div class="panel">
      <h2>Çift Tara replay Emanet (Escrow) Sargytlary</h2>
      <p class="muted">Satyjy we alyjy ikisi hem tassyklamasa, serişde emanetde saklanýar.</p>
      <div id="orders-list"></div>
    </div>
  </main>

  <script src="assets/tkm.js"></script>
  <script>
    mountPlayerokShell("orders", "", true);

    let orders = [];
    let withdrawals = [];
    const focusOrderId = new URLSearchParams(window.location.search).get("order") || "";

    function getActiveSeller() {
      const inp = document.getElementById("w-seller");
      return (inp && inp.value.trim()) || getUser().username || "Serkanbey77";
    }

    function computeBalances() {
      const seller = getActiveSeller().toLowerCase();
      let releasedSum = 0;
      let holdSum = 0;
      let withdrawnSum = 0;

      for (const o of orders) {
        const oSeller = String(o.seller || "Serkanbey77").toLowerCase();
        if (oSeller !== seller) continue;
        const amt = Number(o.price_tmt || 0);
        if (o.seller_confirmed && o.buyer_confirmed) releasedSum += amt;
        else holdSum += amt;
      }

      for (const w of withdrawals) {
        const wSeller = String(w.seller || "Serkanbey77").toLowerCase();
        if (wSeller !== seller) continue;
        if (w.status !== "rejected") withdrawnSum += Number(w.amount_tmt || 0);
      }

      const avail = Math.max(0, releasedSum - withdrawnSum);
      document.getElementById("available-balance").textContent = `${avail.toLocaleString()} TMT`;
      document.getElementById("escrow-balance").textContent = `${holdSum.toLocaleString()} TMT`;
      return avail;
    }

    async function loadAll() {
      try {
        orders = await sbGet("orders");
        setDbPill(true, "Onlaýn");
      } catch (_) {
        orders = [];
        setDbPill(false, "Ýerli");
      }

      try {
        withdrawals = await sbGet("withdrawals");
      } catch (_) {
        try {
          withdrawals = JSON.parse(localStorage.getItem("tkm_withdrawals_cache") || "[]");
        } catch (__) {
          withdrawals = [];
        }
      }

      computeBalances();
      renderWithdrawals();
      renderOrders();
    }

    function renderWithdrawals() {
      const wrap = document.getElementById("withdrawals-list");
      if (!withdrawals.length) {
        wrap.innerHTML = `<p class="muted">Heniz pul çekiş islegi ýok.</p>`;
        return;
      }
      wrap.innerHTML = withdrawals.map(w => `
        <div class="list-row">
          <div>
            <strong>${Number(w.amount_tmt || 0).toLocaleString()} TMT</strong> — <span class="chip-cat">${esc(w.method)}</span>
            <div class="muted">Satyjy: ${esc(w.seller)} · Salgy/Karta: ${esc(w.wallet_or_card)}</div>
          </div>
          <span class="badge-status ${w.status === "approved" ? "ok" : ""}">${esc(w.status === "approved" ? "Tassyklanyldy ✅" : "Garaşylýar ⏳")}</span>
        </div>
      `).join("");
    }

    function renderOrders() {
      const wrap = document.getElementById("orders-list");
      if (!orders.length) {
        wrap.innerHTML = `<p class="muted">Heniz emanet sargyt ýok.</p>`;
        return;
      }

      wrap.innerHTML = orders.map(o => {
        const sOk = Boolean(o.seller_confirmed);
        const bOk = Boolean(o.buyer_confirmed);
        const bothDone = sOk && bOk;
        const hi = focusOrderId && String(o.id) === String(focusOrderId);

        return `
          <div class="panel" style="margin-top:12px; ${hi ? "border-color:#34d399; box-shadow:0 0 22px rgba(52,211,153,0.35);" : ""}">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;">
              <div>
                <strong>${esc(o.order_code || ("Sargyt #" + o.id))}</strong> — ${esc(o.product_title)}
                <div class="muted">${Number(o.price_tmt || 0).toLocaleString()} TMT · Satyjy: <strong>${esc(o.seller || "Serkanbey77")}</strong></div>
              </div>
              <span class="badge-status ${bothDone ? "ok" : ""}">${bothDone ? "Tamamlandy ✅" : "Emanetde Saklanýar 🔒"}</span>
            </div>

            <div class="cred-card">
              <div><strong>Hasap Girişi:</strong> ${esc(o.account_login || "Satyjy tarapyndan berler")}</div>
              <div><strong>Hasap Paroly:</strong> ${esc(o.account_password || "Satyjy tarapyndan berler")}</div>
              ${o.account_extra ? `<div><strong>Goşmaça:</strong> ${esc(o.account_extra)}</div>` : ""}
              <div><strong>Tassyklama Ýagdaýy:</strong> Satyjy: ${sOk ? "✅ Tassyklady" : "⏳ Garaşylýar"} · Alyjy: ${bOk ? "✅ Tassyklady" : "⏳ Garaşylýar"}</div>
            </div>

            <div class="btn-row">
              ${!sOk ? `<button class="btn btn-soft" type="button" onclick="confirmSide(${o.id}, 'seller')">Satyjy Tassyklasy</button>` : ""}
              ${!bOk ? `<button class="btn btn-green" type="button" onclick="confirmSide(${o.id}, 'buyer')">Alyjy Tassyklasy (Hasap Sag)</button>` : ""}
            </div>
          </div>
        `;
      }).join("");
    }

    async function confirmSide(id, side) {
      const target = orders.find(x => String(x.id) === String(id));
      if (!target) return;

      const nextSeller = side === "seller" ? true : Boolean(target.seller_confirmed);
      const nextBuyer = side === "buyer" ? true : Boolean(target.buyer_confirmed);
      const completed = nextSeller && nextBuyer;

      try {
        await sbPatch("orders", id, {
          seller_confirmed: nextSeller,
          buyer_confirmed: nextBuyer,
          escrow_status: completed ? "released" : "escrow_hold",
          status: completed ? "completed" : "pending_confirmation"
        });
        showToast(completed ? "İki tarap hem tassyklady — Serişde açyldy!" : "Tassygyňyz ýazdyryldy.");
        loadAll();
      } catch (err) {
        showToast("Tassyklap bolmady: " + err.message);
      }
    }

    document.getElementById("w-seller").addEventListener("input", () => {
      document.getElementById("w-seller").dataset.edited = "1";
      computeBalances();
    });

    document.getElementById("withdraw-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const seller = getActiveSeller();
      const amount = Number(document.getElementById("w-amount").value || 0);
      const method = document.getElementById("w-method").value;
      const target = document.getElementById("w-target").value.trim();
      const avail = computeBalances();

      if (amount <= 0 || !target) {
        showToast("Möçberi we karta/gapjyk maglumatyny giriziň!");
        return;
      }
      if (amount > avail) {
        showToast(`Çekip bolýan bakiýe ýeterlik däl (${avail.toLocaleString()} TMT).`);
        return;
      }

      const payload = {
        seller,
        amount_tmt: amount,
        method,
        wallet_or_card: target,
        status: "pending"
      };

      try {
        await sbInsert("withdrawals", payload);
        showToast("Pul çekiş islegi iberildi!");
      } catch (_) {
        withdrawals.unshift({ id: Date.now(), ...payload });
        localStorage.setItem("tkm_withdrawals_cache", JSON.stringify(withdrawals));
        showToast("İsleg ýerli ýatda ýazdyryldy.");
      }

      e.target.reset();
      document.getElementById("w-seller").value = seller;
      loadAll();
    });

    loadAll();
  </script>
</body>
</html>
