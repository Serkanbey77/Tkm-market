<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TKM Market — Mesajlar</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="tkm-global-fix.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 50% 0%, #1d294d 0%, #0b0f1d 58%, #070a14 100%);
      color: #f8fafc; min-height: 100vh; padding: 14px 14px 86px;
    }
    .wrap { max-width: 600px; margin: 0 auto; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; border-radius: 14px; background: #141b30;
      border: 1px solid rgba(148,163,184,.16); margin-bottom: 12px;
    }
    .topbar a { color: #93c5fd; text-decoration: none; font-weight: 800; font-size: 13px; }
    .card {
      background: #141b30; border: 1px solid rgba(148,163,184,.16);
      border-radius: 16px; padding: 15px;
    }
    .msg-list {
      min-height: 220px; max-height: 360px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 8px;
      background: #0b1020; border: 1px solid rgba(148,163,184,.14);
      border-radius: 12px; padding: 12px; margin-bottom: 10px;
    }
    .bubble {
      background: #1b2440; border: 1px solid rgba(96,165,250,.22);
      border-radius: 11px; padding: 9px 11px; font-size: 13px;
    }
    .meta { font-size: 11px; color: #94a3b8; margin-bottom: 3px; }
    .row { display: flex; gap: 8px; }
    input {
      flex: 1; padding: 11px 12px; border-radius: 10px;
      border: 1px solid rgba(148,163,184,.2); background: #0b1020; color: #fff; font-size: 14px;
    }
    button {
      padding: 11px 15px; border-radius: 10px; border: none;
      background: #2563eb; color: #fff; font-weight: 800; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a href="index.html">← Ana Sayfa</a>
      <div class="tkm-top-right"></div>
    </div>

    <div class="card">
      <div style="font-weight:900;font-size:16px;margin-bottom:10px;">Mesajlar</div>
      <div class="msg-list" id="msgList">
        <div style="font-size:12px;color:#94a3b8;">Henüz mesaj yok.</div>
      </div>
      <div class="row">
        <input type="text" id="msgInput" placeholder="Mesaj yaz..." />
        <button type="button" onclick="sendItem()">Gönder</button>
      </div>
    </div>
  </div>

  <script>
    const STORE_KEY = "tkm_messages_box";
    function readItems() {
      try { return JSON.parse(localStorage.getItem(STORE_KEY) || "[]"); } catch (_) { return []; }
    }
    function renderItems() {
      const items = readItems();
      const box = document.getElementById("msgList");
      if (!items.length) {
        box.innerHTML = `<div style="font-size:12px;color:#94a3b8;">Henüz mesaj yok.</div>`;
        return;
      }
      box.innerHTML = items.map(m => `
        <div class="bubble">
          <div class="meta">${m.time}</div>
          <div>${m.text}</div>
        </div>
      `).join("");
      box.scrollTop = box.scrollHeight;
    }
    function sendItem() {
      const inp = document.getElementById("msgInput");
      const text = inp.value.trim();
      if (!text) return;
      const items = readItems();
      items.push({
        text,
        time: new Date().toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" })
      });
      localStorage.setItem(STORE_KEY, JSON.stringify(items));
      inp.value = "";
      renderItems();
    }
    renderItems();
  </script>
</body>
</html>
