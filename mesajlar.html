<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TKM Market — Sipariş Mesajları &amp; Onay</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="tkm-global-fix.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 50% 0%, #1d294d 0%, #0b0f1d 58%, #070a14 100%);
      color: #f8fafc; min-height: 100vh; padding: 14px 14px 86px;
    }
    .wrap { max-width: 600px; margin: 0 auto; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; border-radius: 14px; background: #141b30;
      border: 1px solid rgba(148,163,184,.16); margin-bottom: 12px;
    }
    .topbar a { color: #93c5fd; text-decoration: none; font-weight: 800; font-size: 13px; }
    .card {
      background: #141b30; border: 1px solid rgba(148,163,184,.16);
      border-radius: 16px; padding: 15px; margin-bottom: 12px;
    }
    .chat-box {
      max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
      background: #0b1020; border: 1px solid rgba(148,163,184,.14); border-radius: 12px; padding: 12px;
      margin-bottom: 10px;
    }
    .msg-bubble {
      background: #1b2440; border: 1px solid rgba(96,165,250,.25);
      border-radius: 11px; padding: 9px 11px; font-size: 13px;
    }
    .msg-meta { font-size: 11px; color: #94a3b8; margin-bottom: 3px; }
    .send-row { display: flex; gap: 8px; }
    input {
      flex: 1; padding: 11px 12px; border-radius: 10px;
      border: 1px solid rgba(148,163,184,.2); background: #0b1020; color: #fff; font-size: 14px;
    }
    button.send {
      padding: 11px 15px; border-radius: 10px; border: none;
      background: #2563eb; color: #fff; font-weight: 800; cursor: pointer;
    }
    button.approve {
      width: 100%; padding: 12px; border-radius: 11px; border: none; margin-top: 10px;
      background: linear-gradient(135deg, #16a34a, #15803d); color: #fff;
      font-weight: 800; font-size: 14px; cursor: pointer;
    }
    .status-note { font-size: 12px; color: #4ade80; font-weight: 700; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a href="index.html">← Ana Sayfa</a>
      <div id="headerRightControls"></div>
    </div>

    <div class="card">
      <div style="font-weight:900;font-size:16px;" id="orderTitle">Sipariş Mesajlaşma Odası</div>
      <div style="font-size:12px;color:#94a3b8;margin-top:4px;" id="orderMeta">Sorunu mesajlarda çözüp teslimatı onaylayabilirsin.</div>
    </div>

    <div class="card">
      <div class="chat-box" id="chatBox">
        <div style="font-size:12px;color:#94a3b8;">Sipariş mesajları yükleniyor...</div>
      </div>
      <div class="send-row">
        <input type="text" id="msgInput" placeholder="Mesaj yaz..." />
        <button type="button" class="send" onclick="sendChatMsg()">Gönder</button>
      </div>
      <button type="button" class="approve" id="approveBtn" onclick="approveOrder()">✓ Sorun Yok — Siparişi Onayla</button>
      <div class="status-note" id="approveStatus"></div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const orderKey = params.get("order") || "genel-siparis";
    const storageKey = "tkm_order_chat_" + orderKey;

    function getMsgs() {
      try { return JSON.parse(localStorage.getItem(storageKey) || "[]"); } catch (_) { return []; }
    }

    function renderMsgs() {
      const list = getMsgs();
      const box = document.getElementById("chatBox");
      if (!list.length) {
        box.innerHTML = `<div style="font-size:12px;color:#94a3b8;">Henüz mesaj yok. Alıcı ve satıcı buradan mesajlaşarak işlemi tamamlayabilir.</div>`;
        return;
      }
      box.innerHTML = list.map(m => `
        <div class="msg-bubble">
          <div class="msg-meta">${m.sender} • ${m.time}</div>
          <div>${m.text}</div>
        </div>
      `).join("");
      box.scrollTop = box.scrollHeight;
    }

    function sendChatMsg() {
      const inp = document.getElementById("msgInput");
      const text = inp.value.trim();
      if (!text) return;
      const list = getMsgs();
      list.push({
        sender: "Kullanıcı",
        text,
        time: new Date().toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" })
      });
      localStorage.setItem(storageKey, JSON.stringify(list));
      inp.value = "";
      renderMsgs();
    }

    async function approveOrder() {
      document.getElementById("approveStatus").textContent = "✓ Sipariş onaylandı, emanet ödemesi tamamlandı.";
      if (window.tkmSb && orderKey !== "genel-siparis") {
        await window.tkmSb
          .from("orders")
          .update({ buyer_confirmed: true, status: "completed", escrow_status: "released" })
          .eq("id", orderKey);
      }
    }

    if (orderKey !== "genel-siparis") {
      document.getElementById("orderTitle").textContent = `Sipariş #${orderKey} — Mesajlar`;
    }
    renderMsgs();
  </script>
</body>
</html>
