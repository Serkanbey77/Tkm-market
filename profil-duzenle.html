<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TKM Market — Profil Düzenle</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 50% 0%, #1d294d 0%, #0b0f1d 58%, #070a14 100%);
      color: #f8fafc; min-height: 100vh; padding: 14px 14px 86px;
    }
    .container { max-width: 560px; margin: 0 auto; }
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 14px; border-radius: 14px; background: #141b30;
      border: 1px solid rgba(148,163,184,.16); margin-bottom: 12px;
    }
    .topbar a { color: #93c5fd; text-decoration: none; font-weight: 800; font-size: 13px; }
    .card {
      background: #141b30; border: 1px solid rgba(148,163,184,.16);
      border-radius: 16px; padding: 16px; margin-bottom: 12px;
    }
    h2 { margin: 0 0 10px; font-size: 16px; }
    label { display: block; font-size: 12px; font-weight: 700; color: #94a3b8; margin-bottom: 5px; }
    input, textarea {
      width: 100%; padding: 11px 12px; border-radius: 10px;
      border: 1px solid rgba(148,163,184,.18); background: #0b0f1d; color: #fff;
      font-size: 14px; font-family: inherit; margin-bottom: 11px;
    }
    textarea { min-height: 80px; resize: vertical; }
    button {
      width: 100%; padding: 12px; border-radius: 11px; border: none;
      background: linear-gradient(135deg, #5b4df5, #3b6ef6); color: #fff;
      font-weight: 800; font-size: 14px; cursor: pointer;
    }
    .msg { font-size: 12px; font-weight: 700; margin-top: 8px; min-height: 18px; }
    .ok { color: #4ade80; } .err { color: #f87171; }
    .bottom-nav {
      position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr);
      background: rgba(15, 21, 38, 0.97); border-top: 1px solid rgba(148,163,184,.16); padding: 8px 4px;
    }
    .bottom-nav a { text-decoration: none; color: #94a3b8; text-align: center; font-size: 11px; font-weight: 700; }
    .bottom-nav a.active { color: #60a5fa; }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <a href="profil.html">← Profil Menüsü</a>
      <span style="font-size:13px;font-weight:800;">Profil Düzenle</span>
    </div>
    <div class="card">
      <h2>Kimlik &amp; İletişim Doğrulama</h2>
      <p style="font-size:12px;color:#94a3b8;margin-top:0;">TC kimlik numarası sorulmaz. İsim soyad ve telefon numaranı kaydederek hesabını doğrula.</p>
      <label>İsim Soyad</label>
      <input type="text" id="edName" placeholder="Adınız Soyadınız" />
      <label>E-posta Adresi</label>
      <input type="email" id="edEmail" disabled />
      <label>Telefon Numarası</label>
      <input type="tel" id="edPhone" placeholder="+993 6x xxx xx xx" />
      <label>Adres Bilgisi (İsteğe Bağlı)</label>
      <textarea id="edAddr" placeholder="İl, ilçe ve açık adres bilginiz..."></textarea>
      <button type="button" onclick="saveProfile()">Bilgilerimi Kaydet ve Doğrula</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>
  <nav class="bottom-nav">
    <a href="index.html">Ana Sayfa</a>
    <a href="index.html#ilan-pazari">İlan Pazarı</a>
    <a href="index.html#kategoriler">Kategoriler</a>
    <a href="bakiye-yatir.html">Cüzdan</a>
    <a href="profil.html" class="active">Profil</a>
  </nav>
  <script>
    const sb = supabase.createClient("https://piajbopfeqlyupkrsnik.supabase.co", "sb_publishable_gQFoj3SUxW-TUMjYmTGrIg_5_6hwBAH");
    let uid = null;

    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (!session?.user) { location.href = "profil.html"; return; }
      uid = session.user.id;
      const { data: prof } = await sb.from("profiles").select("*").eq("id", uid).single();
      document.getElementById("edName").value = prof?.full_name || "";
      document.getElementById("edEmail").value = prof?.email || session.user.email || "";
      document.getElementById("edPhone").value = prof?.phone || "";
      document.getElementById("edAddr").value = prof?.address || "";
    })();

    async function saveProfile() {
      const full_name = document.getElementById("edName").value.trim();
      const phone = document.getElementById("edPhone").value.trim();
      const address = document.getElementById("edAddr").value.trim();
      const msg = document.getElementById("msg");
      if (!full_name || !phone) { msg.className = "msg err"; msg.textContent = "İsim soyad ve telefon numarası zorunlu."; return; }
      const { error } = await sb.from("profiles").update({
        full_name, phone, address, is_verified: true, updated_at: new Date().toISOString()
      }).eq("id", uid);
      msg.className = error ? "msg err" : "msg ok";
      msg.textContent = error ? error.message : "Bilgileriniz kaydedildi ve hesabınız doğrulandı!";
    }
  </script>
</body>
</html>
