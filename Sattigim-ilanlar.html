<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TKM Market — Sattığım İlanlar</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 50% 0%, #1d294d 0%, #0b0f1d 58%, #070a14 100%);
      color: #f8fafc; min-height: 100vh; padding: 14px 14px 86px;
    }
    .container { max-width: 560px; margin: 0 auto; }
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 14px; border-radius: 14px; background: #141b30;
      border: 1px solid rgba(148,163,184,.16); margin-bottom: 12px;
    }
    .topbar a { color: #93c5fd; text-decoration: none; font-weight: 800; font-size: 13px; }
    .card {
      background: #141b30; border: 1px solid rgba(148,163,184,.16);
      border-radius: 16px; padding: 16px;
    }
    .row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 11px 0; border-bottom: 1px solid rgba(148,163,184,.14); font-size: 13px;
    }
    .row:last-child { border-bottom: none; }
    .muted { font-size: 12px; color: #94a3b8; }
    .bottom-nav {
      position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr);
      background: rgba(15, 21, 38, 0.97); border-top: 1px solid rgba(148,163,184,.16); padding: 8px 4px;
    }
    .bottom-nav a { text-decoration: none; color: #94a3b8; text-align: center; font-size: 11px; font-weight: 700; }
    .bottom-nav a.active { color: #60a5fa; }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <a href="profil.html">← Profil Menüsü</a>
      <span style="font-size:13px;font-weight:800;">Sattığım İlanlar</span>
    </div>
    <div class="card" id="box"><div class="muted">Yükleniyor...</div></div>
  </div>
  <nav class="bottom-nav">
    <a href="index.html">Ana Sayfa</a>
    <a href="index.html#ilan-pazari">İlan Pazarı</a>
    <a href="index.html#kategoriler">Kategoriler</a>
    <a href="bakiye-yatir.html">Cüzdan</a>
    <a href="profil.html" class="active">Profil</a>
  </nav>
  <script>
    const sb = supabase.createClient("https://piajbopfeqlyupkrsnik.supabase.co", "sb_publishable_gQFoj3SUxW-TUMjYmTGrIg_5_6hwBAH");
    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (!session?.user) { location.href = "profil.html"; return; }
      const { data } = await sb.from("orders").select("*").eq("seller_id", session.user.id).order("created_at", { ascending: false });
      const box = document.getElementById("box");
      if (!data || !data.length) {
        box.innerHTML = `<div class="muted">Satılan ilan bulunamadı. Henüz satışınız yoksa ilan oluşturup satışa başlayabilirsiniz.</div>`;
        return;
      }
      box.innerHTML = data.map(o => `<div class="row"><div><strong>${o.listing_title}</strong><div class="muted">${o.status}</div></div><strong>${Number(o.amount_tmt).toFixed(2)} TMT</strong></div>`).join("");
    })();
  </script>
</body>
</html>
