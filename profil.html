<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TKM Market — Profil & Cüzdan</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top, #132240 0%, #070b14 70%);
      color: #f8fafc; min-height: 100vh; padding: 16px;
    }
    .wrap { max-width: 520px; margin: 0 auto; }
    .top {
      display: flex; justify-content: space-between; align-items: center;
      padding-bottom: 12px; margin-bottom: 16px; border-bottom: 1px solid #1e293b;
    }
    .logo { font-weight: 900; font-size: 18px; color: #38bdf8; text-decoration: none; }
    .nav { display: flex; gap: 8px; }
    .nav a {
      color: #e2e8f0; text-decoration: none; font-size: 13px;
      padding: 6px 10px; border-radius: 8px; background: #111827; border: 1px solid #243247;
    }
    .card {
      background: #101827; border: 1px solid #1f2d42; border-radius: 16px;
      padding: 18px; margin-bottom: 14px;
    }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .tab {
      padding: 10px; border-radius: 10px; border: 1px solid #243247;
      background: #0b111e; color: #94a3b8; font-weight: 700; cursor: pointer;
    }
    .tab.active { background: #0284c7; color: #fff; border-color: #38bdf8; }
    label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px; }
    input {
      width: 100%; padding: 11px 12px; border-radius: 10px;
      border: 1px solid #26354d; background: #090e1a; color: #fff;
      font-size: 14px; margin-bottom: 12px;
    }
    .btn {
      width: 100%; padding: 12px; border: none; border-radius: 10px;
      background: #0284c7; color: #fff; font-weight: 700; font-size: 14px; cursor: pointer;
    }
    .wallet {
      display: flex; justify-content: space-between; align-items: center;
      background: #090e1a; border: 1px solid #1f2d42; border-radius: 12px;
      padding: 14px; margin: 14px 0;
    }
    .bal { font-size: 26px; font-weight: 900; color: #22c55e; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .link-btn {
      display: block; text-align: center; text-decoration: none;
      padding: 11px; border-radius: 10px; font-weight: 700; font-size: 13px;
    }
    .dep { background: #16a34a; color: #fff; }
    .with { background: #1e293b; color: #f8fafc; border: 1px solid #334155; }
    .out {
      background: rgba(239, 68, 68, 0.14); color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.35); border-radius: 8px;
      padding: 6px 10px; font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .muted { color: #94a3b8; font-size: 12px; }
    .msg { font-size: 12px; margin-top: 8px; min-height: 18px; }
    .err { color: #f87171; } .ok { color: #4ade80; }
    .row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 9px 0; border-bottom: 1px solid #1a2538; font-size: 13px;
    }
    .row:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a class="logo" href="index.html">TKM MARKET</a>
      <div class="nav">
        <a href="index.html">Vitrin</a>
        <a href="bakiye-yatir.html" id="navDep" style="display:none;">Yatır</a>
        <a href="pul-cek.html" id="navWith" style="display:none;">Çek</a>
      </div>
    </div>

    <div class="card" id="authBox" style="display:none;">
      <div class="tabs">
        <button class="tab active" id="tLogin" onclick="setMode('login')">Giriş Yap</button>
        <button class="tab" id="tReg" onclick="setMode('reg')">Kayıt Ol</button>
      </div>

      <div id="fLogin">
        <label>E-posta</label>
        <input type="email" id="lEmail" placeholder="ornek@mail.com" />
        <label>Şifre</label>
        <input type="password" id="lPass" placeholder="••••••••" />
        <button class="btn" onclick="login()">Giriş Yap</button>
      </div>

      <div id="fReg" style="display:none;">
        <label>Kullanıcı Adı</label>
        <input type="text" id="rUser" placeholder="Kullanıcı adın" />
        <label>E-posta</label>
        <input type="email" id="rEmail" placeholder="ornek@mail.com" />
        <label>Şifre (en az 6 karakter)</label>
        <input type="password" id="rPass" placeholder="••••••••" />
        <button class="btn" onclick="register()">Kayıt Ol</button>
      </div>

      <div class="msg" id="aMsg"></div>
    </div>

    <div id="profBox" style="display:none;">
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div>
            <div style="font-size:18px; font-weight:800;" id="pName">-</div>
            <div class="muted" id="pEmail">-</div>
          </div>
          <button class="out" onclick="logout()">Çıkış</button>
        </div>

        <div class="wallet">
          <div>
            <div class="muted">Cüzdan Bakiyesi</div>
            <div class="bal" id="pBal">$0.00</div>
          </div>
          <div style="text-align:right;">
            <div class="muted">Rol</div>
            <div style="font-weight:700; color:#38bdf8; font-size:13px;" id="pRole">Üye</div>
          </div>
        </div>

        <div class="grid2">
          <a class="link-btn dep" href="bakiye-yatir.html">+ Bakiye Yatır</a>
          <a class="link-btn with" href="pul-cek.html">↗ Bakiye Çek</a>
        </div>
      </div>

      <div class="card">
        <div style="font-weight:700; margin-bottom:10px;">Kullanıcı Adını Güncelle</div>
        <input type="text" id="eName" placeholder="Yeni kullanıcı adı" />
        <button class="btn" onclick="updateName()">Kaydet</button>
        <div class="msg" id="pMsg"></div>
      </div>

      <div class="card">
        <div style="font-weight:700; margin-bottom:8px;">Son İşlemler</div>
        <div id="txBox"><div class="muted">Yükleniyor...</div></div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://piajbopfeqlyupkrsnik.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_gQFoj3SUxW-TUMjYmTGrIg_5_6hwBAH";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function setMode(m) {
      document.getElementById("tLogin").classList.toggle("active", m === "login");
      document.getElementById("tReg").classList.toggle("active", m === "reg");
      document.getElementById("fLogin").style.display = m === "login" ? "block" : "none";
      document.getElementById("fReg").style.display = m === "reg" ? "block" : "none";
      document.getElementById("aMsg").innerText = "";
    }

    async function login() {
      const email = document.getElementById("lEmail").value.trim().toLowerCase();
      const password = document.getElementById("lPass").value;
      const msg = document.getElementById("aMsg");
      msg.className = "msg"; msg.innerText = "Giriş yapılıyor...";

      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) { msg.className = "msg err"; msg.innerText = error.message; return; }
      load();
    }

    async function register() {
      const username = document.getElementById("rUser").value.trim();
      const email = document.getElementById("rEmail").value.trim().toLowerCase();
      const password = document.getElementById("rPass").value;
      const msg = document.getElementById("aMsg");
      msg.className = "msg";

      if (!username || !email || password.length < 6) {
        msg.className = "msg err"; msg.innerText = "Kullanıcı adı, e-posta ve en az 6 karakter şifre gir.";
        return;
      }

      msg.innerText = "Hesap açılıyor...";
      const { data, error } = await sb.auth.signUp({
        email, password, options: { data: { username } }
      });
      if (error) { msg.className = "msg err"; msg.innerText = error.message; return; }

      if (!data.session) {
        await sb.auth.signInWithPassword({ email, password });
      }
      load();
    }

    async function logout() {
      await sb.auth.signOut();
      location.reload();
    }

    async function updateName() {
      const { data: { user } } = await sb.auth.getUser();
      const username = document.getElementById("eName").value.trim();
      const msg = document.getElementById("pMsg");
      if (!user || !username) return;

      const { error } = await sb.from("profiles").update({ username }).eq("id", user.id);
      msg.className = error ? "msg err" : "msg ok";
      msg.innerText = error ? error.message : "Güncellendi!";
      if (!error) load();
    }

    async function load() {
      const { data: { user } } = await sb.auth.getUser();
      const logged = !!user;
      document.getElementById("navDep").style.display = logged ? "inline-block" : "none";
      document.getElementById("navWith").style.display = logged ? "inline-block" : "none";
      document.getElementById("authBox").style.display = logged ? "none" : "block";
      document.getElementById("profBox").style.display = logged ? "block" : "none";
      if (!logged) return;

      let { data: prof } = await sb.from("profiles").select("*").eq("id", user.id).maybeSingle();
      if (!prof) {
        const uname = user.user_metadata?.username || user.email.split("@")[0];
        const role = user.email.toLowerCase() === "sahip@tkm-market.store" ? "admin" : "user";
        await sb.from("profiles").upsert({ id: user.id, email: user.email, username: uname, role, balance: 0 });
        prof = (await sb.from("profiles").select("*").eq("id", user.id).single()).data;
      }

      document.getElementById("pName").innerText = prof.username;
      document.getElementById("eName").value = prof.username;
      document.getElementById("pEmail").innerText = prof.email;
      document.getElementById("pBal").innerText = `$${Number(prof.balance || 0).toFixed(2)}`;
      document.getElementById("pRole").innerText = prof.role === "admin" ? "Platform Sahibi" : "Üye";

      const [{ data: deps }, { data: withs }] = await Promise.all([
        sb.from("deposits").select("amount, method, status, created_at").eq("user_id", user.id).order("created_at", { ascending: false }).limit(5),
        sb.from("withdrawals").select("amount, method, status, created_at").eq("user_id", user.id).order("created_at", { ascending: false }).limit(5)
      ]);

      const list = [
        ...(deps || []).map(x => ({ ...x, label: "Yatırım" })),
        ...(withs || []).map(x => ({ ...x, label: "Çekim" }))
      ].sort((a, b) => new Date(b.created_at) - new Date(a.created_at)).slice(0, 6);

      const box = document.getElementById("txBox");
      if (!list.length) {
        box.innerHTML = `<div class="muted">Henüz işlem yok.</div>`;
      } else {
        box.innerHTML = list.map(i => `
          <div class="row">
            <div><strong>${i.label}</strong> <span class="muted">(${i.method})</span></div>
            <div><strong>$${Number(i.amount).toFixed(2)}</strong> <span class="muted">• ${i.status}</span></div>
          </div>
        `).join("");
      }
    }

    load();
  </script>
</body>
</html>
