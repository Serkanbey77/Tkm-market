<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TKM Market — Profil</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #0b0f1d; --card: #141b30; --card-2: #1b2440;
      --border: rgba(148, 163, 184, 0.16); --primary: #3b6ef6; --primary-2: #5b4df5;
      --text: #f8fafc; --muted: #94a3b8;
    }
    body {
      margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 50% 0%, #1d294d 0%, var(--bg) 58%, #070a14 100%);
      color: var(--text); min-height: 100vh; padding: 14px 14px 86px;
    }
    .container { max-width: 560px; margin: 0 auto; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; border-radius: 14px; background: rgba(20, 27, 48, 0.94);
      border: 1px solid var(--border); margin-bottom: 12px;
    }
    .brand { font-weight: 900; font-size: 18px; color: #fff; text-decoration: none; }
    .brand span { color: #60a5fa; }
    .top-btn {
      text-decoration: none; color: var(--text); font-size: 12px; font-weight: 700;
      padding: 7px 11px; border-radius: 9px; background: var(--card-2); border: 1px solid var(--border);
    }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 15px; margin-bottom: 12px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
    }
    .wallet-hero {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      background: var(--card-2); border: 1px solid var(--border);
      border-radius: 14px; padding: 13px 14px; margin-bottom: 10px;
    }
    .user-left { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .avatar {
      width: 48px; height: 48px; border-radius: 13px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 19px; color: #fff;
    }
    .u-name { font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sub-link { color: #93c5fd; font-size: 12px; font-weight: 700; text-decoration: none; display: inline-block; margin-top: 3px; }
    .bal-right { text-align: right; flex-shrink: 0; }
    .bal-main { font-size: 16px; font-weight: 900; color: #fff; }
    .bal-label { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .withdrawable-box {
      display: flex; align-items: center; justify-content: space-between;
      background: #101628; border: 1px solid var(--border);
      border-radius: 13px; padding: 12px 14px; margin-bottom: 12px;
    }
    .w-val { font-size: 15px; font-weight: 800; color: #4ade80; }
    .verify-cta {
      display: block; width: 100%; text-align: center; text-decoration: none;
      padding: 12px; border-radius: 11px; font-weight: 800; font-size: 13px;
      background: #2563eb; color: #fff; margin-bottom: 10px;
    }
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 9px; }
    .action-btn {
      display: block; width: 100%; padding: 12px; border-radius: 11px; border: none;
      font-weight: 800; font-size: 13px; cursor: pointer; text-decoration: none; text-align: center;
    }
    .btn-dep { background: linear-gradient(135deg, var(--primary-2), var(--primary)); color: #fff; }
    .btn-with { background: var(--primary); color: #fff; }
    .btn-full { background: linear-gradient(135deg, var(--primary-2), var(--primary)); color: #fff; }
    .menu-list { display: flex; flex-direction: column; gap: 6px; }
    .menu-link {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      background: var(--card-2); border: 1px solid var(--border); color: var(--text);
      padding: 13px 14px; border-radius: 12px; font-size: 14px; font-weight: 700;
      text-decoration: none; cursor: pointer;
    }
    .menu-link.danger { color: #f87171; background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.28); }
    .pill { padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 800; }
    .pill.ok { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
    .pill.wait { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
    .tabs2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .tab-btn {
      padding: 10px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg); color: var(--muted); font-weight: 800; cursor: pointer;
    }
    .tab-btn.active { background: var(--primary); color: #fff; }
    label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 5px; }
    input {
      width: 100%; padding: 11px 12px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
      font-size: 14px; margin-bottom: 11px;
    }
    .feedback { font-size: 12px; font-weight: 700; min-height: 18px; margin-top: 8px; }
    .feedback.err { color: #f87171; } .feedback.ok { color: #4ade80; }
    .bottom-nav {
      position: fixed; left: 0; right: 0; bottom: 0;
      display: grid; grid-template-columns: repeat(5, 1fr);
      background: rgba(15, 21, 38, 0.97); border-top: 1px solid var(--border);
      padding: 8px 4px; backdrop-filter: blur(12px); z-index: 20;
    }
    .bottom-nav a {
      text-decoration: none; color: var(--muted); text-align: center;
      font-size: 11px; font-weight: 700; padding: 4px 2px;
    }
    .bottom-nav a.active { color: #60a5fa; }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <a class="brand" href="index.html">TKM <span>MARKET</span></a>
      <a class="top-btn" href="index.html">Ana Sayfa</a>
    </div>

    <!-- Giriş / Üye Ol -->
    <div class="card" id="authCard" style="display:none;">
      <div class="tabs2">
        <button type="button" class="tab-btn active" id="tabIn" onclick="switchAuth('in')">Giriş Yap</button>
        <button type="button" class="tab-btn" id="tabUp" onclick="switchAuth('up')">Üye Ol</button>
      </div>
      <div id="boxIn">
        <label>E-posta Adresi</label>
        <input type="email" id="inEmail" placeholder="ornek@mail.com" autocomplete="email" />
        <label>Şifre</label>
        <input type="password" id="inPass" placeholder="••••••••" autocomplete="current-password" />
        <button type="button" class="action-btn btn-full" onclick="doLogin()">Giriş Yap</button>
      </div>
      <div id="boxUp" style="display:none;">
        <label>İsim Soyad</label>
        <input type="text" id="upName" placeholder="Adınız Soyadınız" />
        <label>E-posta Adresi</label>
        <input type="email" id="upEmail" placeholder="ornek@mail.com" />
        <label>Telefon Numarası</label>
        <input type="tel" id="upPhone" placeholder="+993 6x xxx xx xx" />
        <label>Şifre (en az 6 karakter)</label>
        <input type="password" id="upPass" placeholder="••••••••" />
        <button type="button" class="action-btn btn-full" onclick="doRegister()">Üye Ol</button>
      </div>
      <div class="feedback" id="authMsg"></div>
    </div>

    <!-- Profil Menüsü -->
    <div id="profileMenuArea" style="display:none;">
      <div class="card">
        <div class="wallet-hero">
          <div class="user-left">
            <div class="avatar" id="av">T</div>
            <div style="min-width:0;">
              <div class="u-name" id="topUsername">Kullanıcı</div>
              <a class="sub-link" href="profil-gor.html">Profili Gör ›</a>
            </div>
          </div>
          <div class="bal-right">
            <div class="bal-main" id="balTmt">0.00 TMT</div>
            <div class="bal-label">Bakiyeniz</div>
          </div>
        </div>

        <div class="withdrawable-box">
          <div>
            <div class="w-val" id="withTmt">0.00 TMT</div>
            <div class="bal-label">Çekilebilir Bakiye</div>
          </div>
          <span class="pill wait" id="verBadge">Doğrulama Bekleniyor</span>
        </div>

        <a class="verify-cta" id="verifyShortcut" href="profil-duzenle.html">🛡️ Kimlik Doğrula</a>

        <div class="btn-row">
          <a class="action-btn btn-dep" href="bakiye-yatir.html">Bakiye Yükle</a>
          <a class="action-btn btn-with" href="pul-cek.html">Para Çek</a>
        </div>
        <a class="action-btn btn-full" href="ilanlarim.html">+ İlan Ekle</a>
      </div>

      <div class="card">
        <div class="menu-list">
          <a class="menu-link" href="kontrol-merkezi.html"><span>Kontrol Merkezi</span><span>›</span></a>
          <a class="menu-link" href="siparislerim.html"><span>Siparişlerim</span><span>›</span></a>
          <a class="menu-link" href="ilanlarim.html"><span>İlanlarım</span><span>›</span></a>
          <a class="menu-link" href="sattigim-ilanlar.html"><span>Sattığım İlanlar</span><span>›</span></a>
          <a class="menu-link" href="sepetim.html"><span>Sepetim</span><span>›</span></a>
          <a class="menu-link" href="profil-duzenle.html"><span>Profil Düzenle</span><span>›</span></a>
          <button type="button" class="menu-link danger" onclick="doLogout()"><span>Çıkış Yap</span><span>›</span></button>
        </div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html">Ana Sayfa</a>
    <a href="index.html#ilan-pazari">İlan Pazarı</a>
    <a href="index.html#kategoriler">Kategoriler</a>
    <a href="bakiye-yatir.html">Cüzdan</a>
    <a href="profil.html" class="active">Profil</a>
  </nav>

  <script>
    const SUPABASE_URL = "https://piajbopfeqlyupkrsnik.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_gQFoj3SUxW-TUMjYmTGrIg_5_6hwBAH";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });

    function switchAuth(m) {
      document.getElementById("tabIn").classList.toggle("active", m === "in");
      document.getElementById("tabUp").classList.toggle("active", m === "up");
      document.getElementById("boxIn").style.display = m === "in" ? "block" : "none";
      document.getElementById("boxUp").style.display = m === "up" ? "block" : "none";
      document.getElementById("authMsg").textContent = "";
    }

    async function doLogin() {
      const email = document.getElementById("inEmail").value.trim().toLowerCase();
      const password = document.getElementById("inPass").value;
      const msg = document.getElementById("authMsg");
      if (!email || !password) { msg.className = "feedback err"; msg.textContent = "E-posta ve şifre girin."; return; }
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) { msg.className = "feedback err"; msg.textContent = error.message; return; }
      renderMenu(data.user);
    }

    async function doRegister() {
      const full_name = document.getElementById("upName").value.trim();
      const email = document.getElementById("upEmail").value.trim().toLowerCase();
      const phone = document.getElementById("upPhone").value.trim();
      const password = document.getElementById("upPass").value;
      const msg = document.getElementById("authMsg");
      if (!full_name || !email || password.length < 6) {
        msg.className = "feedback err"; msg.textContent = "İsim soyad, e-posta ve en az 6 karakter şifre girin."; return;
      }
      const { data, error } = await sb.auth.signUp({ email, password, options: { data: { full_name, phone } } });
      if (error) { msg.className = "feedback err"; msg.textContent = error.message; return; }
      let u = data.session?.user;
      if (!u) {
        const res = await sb.auth.signInWithPassword({ email, password });
        if (res.error) { msg.className = "feedback ok"; msg.textContent = "Kayıt tamamlandı, giriş yapabilirsiniz."; return; }
        u = res.data.user;
      }
      await sb.from("profiles").upsert({ id: u.id, email, full_name, phone, balance_tmt: 0, withdrawable_tmt: 0 });
      renderMenu(u);
    }

    async function doLogout() {
      await sb.auth.signOut();
      location.reload();
    }

    async function renderMenu(user) {
      document.getElementById("authCard").style.display = "none";
      document.getElementById("profileMenuArea").style.display = "block";
      let { data: prof } = await sb.from("profiles").select("*").eq("id", user.id).maybeSingle();
      if (!prof) {
        const fallback = user.user_metadata?.full_name || user.email?.split("@")[0] || "Üye";
        await sb.from("profiles").upsert({ id: user.id, email: user.email, full_name: fallback, balance_tmt: 0, withdrawable_tmt: 0 });
        prof = (await sb.from("profiles").select("*").eq("id", user.id).single()).data;
      }
      const name = prof.full_name || user.email?.split("@")[0] || "Kullanıcı";
      document.getElementById("av").textContent = name.charAt(0).toUpperCase();
      document.getElementById("topUsername").textContent = name;
      document.getElementById("balTmt").textContent = `${Number(prof.balance_tmt || 0).toFixed(2)} TMT`;
      document.getElementById("withTmt").textContent = `${Number(prof.withdrawable_tmt || 0).toFixed(2)} TMT`;
      const badge = document.getElementById("verBadge");
      if (prof.is_verified) {
        badge.className = "pill ok";
        badge.textContent = "✓ Doğrulanmış Profil";
        document.getElementById("verifyShortcut").style.display = "none";
      }
    }

    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (session?.user) renderMenu(session.user);
      else document.getElementById("authCard").style.display = "block";
    })();
  </script>
</body>
</html>
