<!DOCTYPE html>
<html lang="tk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TKM Market — Sanly Harytlar &amp; Hasap Bazary</title>
  <link rel="stylesheet" href="assets/tkm.css" />
</head>
<body>
  <div id="tkm-shell"></div>

  <main class="container">
    <section class="hero-card">
      <div class="hero-badge">ÇIFT TARAPLY EMANET (ESCROW) GORAGY</div>
      <h1>Türkmenistan we Global Sanly Harytlar &amp; Hasap Bazary</h1>
      <p>Hasaplar, sanly hyzmatlar we kripto hödürleri. Satyn alnandan soň hasap maglumatlary açylýar, satyjy we alyjy ikisi hem tassyklamasa pul ortada saklanýar.</p>
      <div class="search-row">
        <input id="q-input" type="text" placeholder="Haryt, hasap ýa-da satyjy gözle..." />
        <button class="btn btn-ghost" type="button" id="reload-btn">Täzele</button>
      </div>
    </section>

    <div class="cat-grid" id="cat-grid">
      <button class="cat-pill active" type="button" data-cat="ALL"><strong>Ählisi</strong><span>Bütin harytlar</span></button>
      <button class="cat-pill" type="button" data-cat="ACCOUNT"><strong>HASAP / OYUN</strong><span>Login &amp; parol</span></button>
      <button class="cat-pill" type="button" data-cat="CRYPTO"><strong>KRIPTO</strong><span>USDT &amp; çalşyk</span></button>
      <button class="cat-pill" type="button" data-cat="DIGITAL"><strong>SANLY HARYT</strong><span>Hasap &amp; ulgam</span></button>
      <button class="cat-pill" type="button" data-cat="SERVICE"><strong>HYZMAT</strong><span>Goldaw &amp; gurnama</span></button>
    </div>

    <div class="products-grid" id="products-list"></div>
  </main>

  <div class="modal-bg" id="detail-modal">
    <div class="modal-box">
      <div class="modal-top">
        <h3 id="dm-title">Haryt</h3>
        <button class="btn btn-ghost" type="button" onclick="document.getElementById('detail-modal').classList.remove('open')">Ýap</button>
      </div>
      <div id="dm-body"></div>
    </div>
  </div>

  <script src="assets/tkm.js"></script>
  <script>
    mountShell("market");
    let products = [];
    let selectedCat = "ALL";

    async function loadProducts() {
      try {
        products = await sbGet("products");
        localStorage.setItem("tkm_cache_products", JSON.stringify(products));
        setDbStatus(true, "Supabase: Baglanyşyk işjeň");
      } catch (err) {
        try { products = JSON.parse(localStorage.getItem("tkm_cache_products") || "[]"); } catch (_) { products = []; }
        setDbStatus(false, "Supabase: Ýerli ätiýaç");
        showToast("Duýduryş: " + err.message);
      }
      render();
    }

    function render() {
      const q = document.getElementById("q-input").value.trim().toLowerCase();
      const wrap = document.getElementById("products-list");
      const items = products.filter(p => {
        const okCat = selectedCat === "ALL" || p.cat === selectedCat;
        const okQ = !q ||
          String(p.title || "").toLowerCase().includes(q) ||
          String(p.seller || "").toLowerCase().includes(q) ||
          String(p.description || "").toLowerCase().includes(q);
        return okCat && okQ;
      });

      if (!items.length) {
        wrap.innerHTML = `<div class="box"><p class="muted">Haryt tapylmady. <strong>Satyjy Paneli</strong> sahypasyndan täze haryt goşup bilersiňiz.</p></div>`;
        return;
      }

      wrap.innerHTML = items.map(p => {
        const imgs = getImages(p);
        return `
          <article class="p-card">
            <div>
              ${imgs[0] ? `<img class="p-img" src="${esc(imgs[0])}" alt="${esc(p.title)}" loading="lazy" onerror="this.style.display='none'" />` : ""}
              <span class="tag">${esc(p.cat || "ACCOUNT")}</span>
              <span class="tag-escrow">ESCROW</span>
              <div class="p-title">${esc(p.title)}</div>
              <p class="p-desc">${esc(p.description || "")}</p>
              <div class="p-seller">Satyjy: <strong>${esc(p.seller || "Serkanbey77")}</strong></div>
              <div class="p-price-line">
                <div class="p-price">${Number(p.price_tmt || 0).toLocaleString()} TMT</div>
                ${p.market_compare_tmt ? `<div class="p-old">${Number(p.market_compare_tmt).toLocaleString()} TMT</div>` : ""}
              </div>
            </div>
            <div class="row-actions">
              <button class="btn btn-ghost" type="button" style="flex:1;" onclick="openDetail(${p.id})">Aç</button>
              <button class="btn btn-primary" type="button" style="flex:1;" onclick="buyNow(${p.id})">Satyn Al</button>
            </div>
          </article>
        `;
      }).join("");
    }

    function openDetail(id) {
      const p = products.find(x => String(x.id) === String(id));
      if (!p) return;
      const imgs = getImages(p);
      document.getElementById("dm-title").textContent = p.title;
      document.getElementById("dm-body").innerHTML = `
        ${imgs.map(src => `<img class="p-img" style="margin-bottom:8px;" src="${esc(src)}" alt="${esc(p.title)}" />`).join("")}
        <span class="tag">${esc(p.cat || "ACCOUNT")}</span>
        <span class="tag-escrow">ÇIFT ONAYLY EMANET</span>
        <p class="p-desc" style="margin-top:8px;">${esc(p.description || "Düşündiriş ýok.")}</p>
        <div class="p-seller">Satyjy: <strong>${esc(p.seller || "Serkanbey77")}</strong></div>
        <div class="info-box">
          <div><strong>Emanet düzgüni:</strong> Hasap ady we paroly satyn alnandan soň Sargytlar sahypasynda açylýar. Satyn alan we satyjy ikisi hem tassyklamasa, pul ortada saklanýar.</div>
        </div>
        <div class="p-price-line" style="margin-top:12px;">
          <div class="p-price">${Number(p.price_tmt || 0).toLocaleString()} TMT</div>
        </div>
        <div class="row-actions">
          <button class="btn btn-primary" type="button" style="flex:1;" onclick="document.getElementById('detail-modal').classList.remove('open'); buyNow(${p.id});">Emanet Bilen Satyn Al</button>
        </div>
      `;
      document.getElementById("detail-modal").classList.add("open");
    }

    async function buyNow(id) {
      const p = products.find(x => String(x.id) === String(id));
      if (!p) return;
      const buyer = getCurrentUser().username;
      const orderCode = "TKM-" + Math.floor(100000 + Math.random() * 900000);
      const secretCode = String(Math.floor(1000 + Math.random() * 9000));

      const payload = {
        order_code: orderCode,
        product_title: p.title,
        seller: p.seller || "Serkanbey77",
        price_tmt: Number(p.price_tmt || 0),
        status: "pending_delivery",
        escrow_status: "escrow_hold",
        seller_confirmed: false,
        buyer_confirmed: false,
        account_login: p.account_login || `Alyjy: ${buyer} — Satyjy bilen habarlaşyň`,
        account_password: p.account_password || `Kod: ${secretCode}`,
        account_extra: p.account_extra || "",
        secret_code: secretCode
      };

      try {
        const saved = await sbInsert("orders", payload);
        const createdId = saved && saved.id ? saved.id : "";
        showToast(`Sargyt açyldy (${orderCode}). Sargytlar sahypasyna geçilýär...`);
        setTimeout(() => {
          window.location.href = createdId ? `sargytlar.html?order=${encodeURIComponent(createdId)}` : "sargytlar.html";
        }, 500);
      } catch (err) {
        showToast("Sargyt döredilmedi: " + err.message);
      }
    }

    document.querySelectorAll(".cat-pill").forEach(btn => {
      btn.addEventListener("click", () => {
        selectedCat = btn.dataset.cat;
        document.querySelectorAll(".cat-pill").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        render();
      });
    });

    document.getElementById("q-input").addEventListener("input", render);
    document.getElementById("reload-btn").addEventListener("click", loadProducts);
    loadProducts();
  </script>
</body>
</html>
