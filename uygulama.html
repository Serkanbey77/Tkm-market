<!DOCTYPE html>
<html lang="tk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bölüm — TKM Market</title>
  <link rel="stylesheet" href="assets/tkm.css" />
</head>
<body>
  <div id="playerok-shell"></div>

  <main class="page-wrap">
    <section class="platform-hero" id="plat-hero">
      <div class="platform-hero-logo" id="plat-hero-logo"></div>
      <div>
        <h1 id="plat-hero-title">Bölüm</h1>
        <p id="plat-hero-sub">Bölüm saýlaň we harytlary görüň</p>
      </div>
    </section>

    <div class="subtabs-scroll" id="subtabs-bar"></div>

    <div class="cards-grid" id="plat-products-grid"></div>
  </main>

  <script src="assets/tkm.js"></script>
  <script>
    mountPlayerokShell("catalog", "Şu bölümde haryt gözle...", true);

    const slug = new URLSearchParams(window.location.search).get("slug") || "pubg-mobile";
    const platform = findPlatform(slug) || GAMES_CATALOG[0];
    const subcats = getSubcatsForPlatform(platform);
    let activeSub = subcats[0] || "Ählisi";
    let allProducts = [];

    document.title = `${platform.name} — TKM Market`;
    const heroEl = document.getElementById("plat-hero");
    heroEl.style.background = platform.banner;
    document.getElementById("plat-hero-logo").innerHTML = platform.logo;
    document.getElementById("plat-hero-title").textContent = platform.name;
    document.getElementById("plat-hero-sub").textContent =
      platform.kind === "game"
        ? "Oýun bölümleri: Hasap • Arenda • UC"
        : (platform.kind === "course"
            ? "Trading Kurs bölümleri"
            : "Programa bölümleri: Hasap • İzlenme • Like • Yorum • Dizayn • Reklam");

    function renderSubtabs() {
      const bar = document.getElementById("subtabs-bar");
      bar.innerHTML = subcats.map(sc => `
        <button class="subtab-link ${activeSub === sc ? "active" : ""}" type="button" onclick="pickSubtab('${esc(sc)}')">${esc(sc)}</button>
      `).join("");
    }

    function pickSubtab(sc) {
      activeSub = sc;
      renderSubtabs();
      renderPlatformItems();
    }

    async function loadPlatformItems() {
      try {
        allProducts = await sbGet("products");
        localStorage.setItem("tkm_prod_cache", JSON.stringify(allProducts));
        setDbPill(true, "Onlaýn");
      } catch (err) {
        try { allProducts = JSON.parse(localStorage.getItem("tkm_prod_cache") || "[]"); } catch (_) { allProducts = []; }
        setDbPill(false, "Ýerli");
      }
      renderPlatformItems();
    }

    function renderPlatformItems() {
      const q = (document.getElementById("global-search")?.value || "").trim().toLowerCase();
      const wrap = document.getElementById("plat-products-grid");

      const items = allProducts.filter(p => {
        const pKey = String(p.platform_id || p.platform_name || p.cat || "").toLowerCase();
        const okPlat = pKey === platform.id.toLowerCase() || pKey === platform.name.toLowerCase();
        const pSub = String(p.subcat || "").toLowerCase();
        const okSub = activeSub === "Ählisi" || pSub === activeSub.toLowerCase();
        const okQ = !q ||
          String(p.title || "").toLowerCase().includes(q) ||
          String(p.description || "").toLowerCase().includes(q) ||
          String(p.seller || "").toLowerCase().includes(q);
        return okPlat && okSub && okQ;
      });

      if (!items.length) {
        const reqText = `${platform.name} (${activeSub})`;
        wrap.innerHTML = `
          <div class="panel">
            <p class="muted"><strong>${esc(reqText)}</strong> boýunça häzirlikçe haryt ýok.</p>
            <div class="btn-row">
              <a class="btn btn-main" style="text-decoration:none;" href="mesajlar.html?item=${encodeURIComponent(reqText)}">
                Maňa ${esc(platform.name)} ${activeSub !== "Ählisi" ? activeSub : "Hasap"} Gerek — Hat Iber
              </a>
            </div>
          </div>
        `;
        return;
      }

      wrap.innerHTML = items.map(p => {
        const imgs = getImages(p);
        return `
          <article class="item-card">
            <div>
              ${imgs[0] ? `<img class="item-img" src="${esc(imgs[0])}" alt="${esc(p.title)}" loading="lazy" onerror="this.style.display='none'" />` : ""}
              <span class="chip-cat">${esc(platform.name)}${p.subcat ? " • " + esc(p.subcat) : ""}</span>
              <span class="chip-escrow">ESCROW</span>
              <div class="item-title">${esc(p.title)}</div>
              <p class="item-desc">${esc(p.description || "")}</p>
              <div class="muted">Satyjy: <strong>${esc(p.seller || "Serkanbey77")}</strong></div>
              <div class="item-price-row">
                <div class="item-price">${Number(p.price_tmt || 0).toLocaleString()} TMT</div>
              </div>
            </div>
            <div class="btn-row">
              <button class="btn btn-main" style="flex:1;" type="button" onclick="buyFromPlatform(${p.id})">Satyn Al</button>
            </div>
          </article>
        `;
      }).join("");
    }

    async function buyFromPlatform(id) {
      const p = allProducts.find(x => String(x.id) === String(id));
      if (!p) return;
      const buyer = getUser().username;
      const code = "TKM-" + Math.floor(100000 + Math.random() * 900000);
      const sec = String(Math.floor(1000 + Math.random() * 9000));

      try {
        const saved = await sbInsert("orders", {
          order_code: code,
          product_title: p.title,
          seller: p.seller || "Serkanbey77",
          price_tmt: Number(p.price_tmt || 0),
          status: "pending_delivery",
          escrow_status: "escrow_hold",
          seller_confirmed: false,
          buyer_confirmed: false,
          account_login: p.account_login || `Alyjy: ${buyer} — Satyjy bilen habarlaşyň`,
          account_password: p.account_password || `Kod: ${sec}`,
          account_extra: p.account_extra || "",
          secret_code: sec
        });
        const createdId = saved && saved.id ? saved.id : "";
        window.location.href = createdId ? `sargytlar.html?order=${encodeURIComponent(createdId)}` : "sargytlar.html";
      } catch (err) {
        showToast("Sargyt döredilmedi: " + err.message);
      }
    }

    document.getElementById("global-search")?.addEventListener("input", renderPlatformItems);
    renderSubtabs();
    loadPlatformItems();
  </script>
</body>
</html>
