<!DOCTYPE html>
<html lang="tk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bölüm — TKM Market</title>
  <link rel="stylesheet" href="assets/tkm.css" />
</head>
<body>
  <div id="playerok-shell"></div>

  <main class="page-wrap">
    <div id="plat-banner-slot" style="margin-bottom:12px;"></div>
    <div class="subtabs-scroll" id="subtabs-bar"></div>
    <div class="cards-grid" id="plat-products-grid"></div>
  </main>

  <script src="assets/tkm.js"></script>
  <script>
    (function () {
      const FALLBACK_LIST = [
        { id: "pubg-mobile", name: "PUBG Mobile", kind: "game", color: "#d97706", tag: "HASAP • ARENDA • UC", subs: ["Ählisi", "Hasap", "Arenda", "UC"] },
        { id: "clash-of-clans", name: "Clash of Clans", kind: "game", color: "#15803d", tag: "HASAP • ELMAS", subs: ["Ählisi", "Hasap", "Elmas"] },
        { id: "minecraft", name: "Minecraft", kind: "game", color: "#4d7c0f", tag: "HASAP • SERVER / REALM", subs: ["Ählisi", "Hasap", "Server / Realm"] },
        { id: "gta-5", name: "GTA 5", kind: "game", color: "#059669", tag: "HASAP", subs: ["Ählisi", "Hasap"] },
        { id: "roblox", name: "Roblox", kind: "game", color: "#dc2626", tag: "HASAP • ROBUX", subs: ["Ählisi", "Hasap", "Robux"] },
        { id: "fortnite", name: "Fortnite", kind: "game", color: "#7c3aed", tag: "HASAP • V-BUCKS", subs: ["Ählisi", "Hasap", "V-Bucks"] },
        { id: "pubg-mobile-korea", name: "PUBG Mobile Kore", kind: "game", color: "#2563eb", tag: "HASAP • ARENDA • UC", subs: ["Ählisi", "Hasap", "Arenda", "UC"] },
        { id: "rust", name: "Rust", kind: "game", color: "#ea580c", tag: "HASAP • ARENDA", subs: ["Ählisi", "Hasap", "Arenda"] },
        { id: "call-of-duty", name: "Call of Duty", kind: "game", color: "#334155", tag: "HASAP • CP", subs: ["Ählisi", "Hasap", "CP"] },
        { id: "far-cry", name: "Far Cry", kind: "game", color: "#f97316", tag: "HASAP", subs: ["Ählisi", "Hasap"] },
        { id: "fifa", name: "FIFA", kind: "game", color: "#16a34a", tag: "HASAP • COINS", subs: ["Ählisi", "Hasap", "Coins"] },
        { id: "tiktok", name: "TikTok", kind: "app", color: "#ec4899", tag: "HASAP • İZLENME • LIKE • YORUM • DIZAYN • REKLAM", subs: ["Ählisi", "Hasap", "İzlenme", "Like", "Yorum", "Dizayn", "Reklam"] },
        { id: "telegram", name: "Telegram", kind: "app", color: "#0284c7", tag: "HASAP • KANAL • İZLENME • REKLAM", subs: ["Ählisi", "Hasap", "Kanal / Grup", "İzlenme", "Reklam", "Bot"] },
        { id: "trading-kurs", name: "Trading Kurs", kind: "course", color: "#0d9488", tag: "KRIPTO TRADING • FOREX • SINYAL", subs: ["Ählisi", "Kripto Trading", "Forex & Altın", "Sinyal"] }
      ];

      function safeEsc(s) {
        return typeof esc === "function"
          ? esc(s)
          : String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      try {
        if (typeof mountPlayerokShell === "function") {
          mountPlayerokShell("catalog", "Şu bölümde haryt gözle...", true);
        }
      } catch (e) {}

      const slug = (new URLSearchParams(window.location.search).get("slug") || "pubg-mobile").toLowerCase().trim();
      let platform = null;
      try {
        if (typeof findPlatform === "function") platform = findPlatform(slug);
      } catch (e) {}
      if (!platform) {
        platform = FALLBACK_LIST.find(x => x.id === slug) || {
          id: slug,
          name: slug.replace(/-/g, " ").replace(/\b\w/g, c => c.toUpperCase()),
          kind: "app",
          color: "#4f46e5",
          tag: "BÖLÜM",
          subs: ["Ählisi", "Hasap"]
        };
      }

      let subcats = ["Ählisi", "Hasap"];
      try {
        if (typeof getSubcatsForPlatform === "function") {
          subcats = getSubcatsForPlatform(platform);
        } else if (Array.isArray(platform.subs)) {
          subcats = platform.subs;
        }
      } catch (e) {}

      let activeSub = subcats[0] || "Ählisi";
      let allProducts = [];

      document.title = `${platform.name} — TKM Market`;

      const bannerSlot = document.getElementById("plat-banner-slot");
      if (bannerSlot) {
        try {
          if (typeof renderBannerWithAsset === "function") {
            bannerSlot.innerHTML = renderBannerWithAsset(platform);
          } else {
            throw new Error("no banner fn");
          }
        } catch (e) {
          const col = platform.color || "#4f46e5";
          bannerSlot.innerHTML = `
            <div style="border-radius:16px;padding:18px;color:#fff;background:linear-gradient(120deg,#0f172a 0%,${col} 100%);">
              <div style="font-size:10px;font-weight:800;opacity:0.9;">${safeEsc(platform.tag || "BÖLÜM")}</div>
              <h1 style="margin:4px 0 0;font-size:20px;">${safeEsc(platform.name)}</h1>
            </div>
          `;
        }
      }

      function renderSubtabs() {
        const bar = document.getElementById("subtabs-bar");
        if (!bar) return;
        bar.innerHTML = subcats.map(sc => {
          const cls = activeSub === sc ? "subtab-link active" : "subtab-link";
          return `<button class="${cls}" type="button" data-sub="${safeEsc(sc)}">${safeEsc(sc)}</button>`;
        }).join("");

        bar.querySelectorAll(".subtab-link").forEach(btn => {
          btn.addEventListener("click", () => {
            activeSub = btn.getAttribute("data-sub") || "Ählisi";
            renderSubtabs();
            renderPlatformItems();
          });
        });
      }

      function renderPlatformItems() {
        const q = ((document.getElementById("global-search")?.value) || "").trim().toLowerCase();
        const wrap = document.getElementById("plat-products-grid");
        if (!wrap) return;

        const items = allProducts.filter(p => {
          const pKey = String(p.platform_id || p.platform_name || p.cat || "").toLowerCase();
          const okPlat = pKey === platform.id.toLowerCase() || pKey === platform.name.toLowerCase();
          const pSub = String(p.subcat || "").toLowerCase();
          const okSub = activeSub === "Ählisi" || pSub === activeSub.toLowerCase();
          const okQ = !q ||
            String(p.title || "").toLowerCase().includes(q) ||
            String(p.description || "").toLowerCase().includes(q) ||
            String(p.seller || "").toLowerCase().includes(q);
          return okPlat && okSub && okQ;
        });

        if (!items.length) {
          const reqText = `${platform.name} (${activeSub})`;
          wrap.innerHTML = `
            <div class="panel">
              <p class="muted"><strong>${safeEsc(reqText)}</strong> boýunça häzirlikçe haryt ýok.</p>
              <div class="btn-row">
                <a class="btn btn-main" style="text-decoration:none;" href="mesajlar.html?item=${encodeURIComponent(reqText)}">
                  Maňa ${safeEsc(platform.name)} ${activeSub !== "Ählisi" ? safeEsc(activeSub) : "Hasap"} Gerek — Hat Iber
                </a>
              </div>
            </div>
          `;
          return;
        }

        wrap.innerHTML = items.map(p => {
          const imgs = (typeof getImages === "function") ? getImages(p) : [];
          return `
            <article class="item-card">
              <div>
                ${imgs[0] ? `<img class="item-img" src="${safeEsc(imgs[0])}" alt="${safeEsc(p.title)}" loading="lazy" onerror="this.style.display='none'" />` : ""}
                <span class="chip-cat">${safeEsc(platform.name)}${p.subcat ? " • " + safeEsc(p.subcat) : ""}</span>
                <span class="chip-escrow">ESCROW</span>
                <div class="item-title">${safeEsc(p.title)}</div>
                <p class="item-desc">${safeEsc(p.description || "")}</p>
                <div class="muted">Satyjy: <strong>${safeEsc(p.seller || "Serkanbey77")}</strong></div>
                <div class="item-price-row">
                  <div class="item-price">${Number(p.price_tmt || 0).toLocaleString()} TMT</div>
                </div>
              </div>
              <div class="btn-row">
                <button class="btn btn-main" style="flex:1;" type="button" onclick="window.location.href='sargytlar.html'">Sargytlara Git</button>
              </div>
            </article>
          `;
        }).join("");
      }

      async function loadPlatformItems() {
        try {
          if (typeof sbGet === "function") {
            allProducts = await sbGet("products");
            localStorage.setItem("tkm_prod_cache", JSON.stringify(allProducts));
            if (typeof setDbPill === "function") setDbPill(true, "Onlaýn");
          }
        } catch (err) {
          try { allProducts = JSON.parse(localStorage.getItem("tkm_prod_cache") || "[]"); } catch (_) { allProducts = []; }
          if (typeof setDbPill === "function") setDbPill(false, "Ýerli");
        }
        renderPlatformItems();
      }

      document.getElementById("global-search")?.addEventListener("input", renderPlatformItems);
      renderSubtabs();
      loadPlatformItems();
    })();
  </script>
</body>
</html>
