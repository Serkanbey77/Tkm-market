<!DOCTYPE html>
<html lang="tk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Satyjy Paneli — TKM Market</title>
  <link rel="stylesheet" href="assets/tkm.css" />
</head>
<body>
  <div id="tkm-shell"></div>

  <main class="container">
    <div class="box">
      <h2 id="form-title">Täze Haryt / Hasap Goş</h2>
      <p class="muted">Hasap satmak isleýän bolsaňyz, aşakda hasap adyny we parolyny giriziň; olar satyn alnandan soň açylýar.</p>

      <div class="grid-2">
        <div class="field">
          <label>Harydyň / Hasabyň ady</label>
          <input id="p-title" type="text" placeholder="Mysal: Steam / PUBG / Sanly Hasap" />
        </div>
        <div class="field">
          <label>Kategoriýa</label>
          <select id="p-cat">
            <option value="ACCOUNT">ACCOUNT (Hasap)</option>
            <option value="CRYPTO">CRYPTO</option>
            <option value="DIGITAL">DIGITAL</option>
            <option value="SERVICE">SERVICE</option>
          </select>
        </div>
        <div class="field">
          <label>Baha (TMT)</label>
          <input id="p-price" type="number" step="0.01" placeholder="250" />
        </div>
        <div class="field">
          <label>Deňeşdirme bahasy (TMT)</label>
          <input id="p-compare" type="number" step="0.01" placeholder="300" />
        </div>
        <div class="field">
          <label>Satyjy ady</label>
          <input id="p-seller" type="text" oninput="this.dataset.touched='1'" />
        </div>
        <div class="field">
          <label>Suratlar (birnäçe saýlap bolýar)</label>
          <input id="p-files" type="file" accept="image/*" multiple />
          <div class="preview-row" id="p-preview"></div>
        </div>
      </div>

      <div class="secret-zone">
        <h3>Gizlin Hasap Giriş Maglumatlary</h3>
        <p class="muted">Vitrinde görünmeýär; diňe satyn alan ulanyja Sargytlar penjiresinde görkezilýär.</p>
        <div class="grid-2">
          <div class="field">
            <label>Hasap Ady / Login</label>
            <input id="p-login" type="text" placeholder="username ýa-da e-mail" />
          </div>
          <div class="field">
            <label>Hasap Paroly</label>
            <input id="p-pass" type="text" placeholder="••••••••" />
          </div>
          <div class="field">
            <label>Goşmaça Maglumat (2FA / Poçta / Bellik)</label>
            <input id="p-extra" type="text" placeholder="Mysal: Poçta bilen berilýär" />
          </div>
        </div>
      </div>

      <div class="field" style="margin-top:12px;">
        <label>Açyk Düşündiriş</label>
        <textarea id="p-desc" rows="2" placeholder="Haryt barada gysgaça maglumat..."></textarea>
      </div>

      <div class="row-actions">
        <button class="btn btn-primary" id="save-btn" type="button" style="flex:1;">Harydy Ýerleşdir</button>
        <button class="btn btn-ghost" id="cancel-btn" type="button" style="display:none;" onclick="resetForm()">Ýatyr</button>
      </div>
    </div>

    <div class="box">
      <h3>Meniň Harytlarym (Üýtgetmek / Pozmak)</h3>
      <div id="my-products"></div>
    </div>
  </main>

  <script src="assets/tkm.js"></script>
  <script>
    mountShell("seller");
    let products = [];
    let editId = null;
    let editImgs = [];
    let pickedFiles = [];

    async function loadSellerProducts() {
      try {
        products = await sbGet("products");
        setDbStatus(true, "Supabase: Baglanyşyk işjeň");
      } catch (err) {
        setDbStatus(false, "Supabase: Ýerli ätiýaç");
        showToast("Duýduryş: " + err.message);
      }
      renderList();
    }

    function renderList() {
      const el = document.getElementById("my-products");
      if (!products.length) {
        el.innerHTML = `<p class="muted">Heniz haryt ýok.</p>`;
        return;
      }
      el.innerHTML = products.map(p => `
        <div class="row-card">
          <div>
            <span class="tag">${esc(p.cat || "ACCOUNT")}</span>
            <strong>${esc(p.title)}</strong>
            <div class="muted">Baha: <strong>${Number(p.price_tmt || 0).toLocaleString()} TMT</strong> · Satyjy: ${esc(p.seller || "")} · Hasap: ${p.account_login ? "Girizilen 🔒" : "Ýok"}</div>
          </div>
          <div class="row-actions" style="margin-top:0;">
            <button class="btn btn-ghost" type="button" onclick="editItem(${p.id})">Üýtget</button>
            <button class="btn btn-danger" type="button" onclick="removeItem(${p.id})">Poz</button>
          </div>
        </div>
      `).join("");
    }

    function resetForm() {
      editId = null;
      editImgs = [];
      pickedFiles = [];
      document.getElementById("form-title").textContent = "Täze Haryt / Hasap Goş";
      document.getElementById("save-btn").textContent = "Harydy Ýerleşdir";
      document.getElementById("cancel-btn").style.display = "none";
      document.getElementById("p-title").value = "";
      document.getElementById("p-cat").value = "ACCOUNT";
      document.getElementById("p-price").value = "";
      document.getElementById("p-compare").value = "";
      document.getElementById("p-login").value = "";
      document.getElementById("p-pass").value = "";
      document.getElementById("p-extra").value = "";
      document.getElementById("p-files").value = "";
      document.getElementById("p-desc").value = "";
      document.getElementById("p-preview").innerHTML = "";
    }

    function editItem(id) {
      const p = products.find(x => String(x.id) === String(id));
      if (!p) return;
      editId = p.id;
      editImgs = getImages(p);
      pickedFiles = [];
      document.getElementById("form-title").textContent = `Harydy Üýtget (#${p.id})`;
      document.getElementById("save-btn").textContent = "Üýtgeşmeleri Ýatda Sakla";
      document.getElementById("cancel-btn").style.display = "inline-block";
      document.getElementById("p-title").value = p.title || "";
      document.getElementById("p-cat").value = p.cat || "ACCOUNT";
      document.getElementById("p-price").value = p.price_tmt ?? "";
      document.getElementById("p-compare").value = p.market_compare_tmt ?? "";
      document.getElementById("p-seller").value = p.seller || getCurrentUser().username;
      document.getElementById("p-login").value = p.account_login || "";
      document.getElementById("p-pass").value = p.account_password || "";
      document.getElementById("p-extra").value = p.account_extra || "";
      document.getElementById("p-desc").value = p.description || "";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function saveItem() {
      const title = document.getElementById("p-title").value.trim();
      const cat = document.getElementById("p-cat").value;
      const priceTmt = parseFloat(document.getElementById("p-price").value);
      const cmpVal = document.getElementById("p-compare").value.trim();
      const marketCompareTmt = cmpVal ? parseFloat(cmpVal) : null;
      const seller = document.getElementById("p-seller").value.trim() || getCurrentUser().username;
      const accountLogin = document.getElementById("p-login").value.trim();
      const accountPassword = document.getElementById("p-pass").value.trim();
      const accountExtra = document.getElementById("p-extra").value.trim();
      const description = document.getElementById("p-desc").value.trim();

      if (!title || isNaN(priceTmt) || priceTmt <= 0) {
        showToast("Harydyň adyny we dogry bahasyny giriziň.");
        return;
      }

      const btn = document.getElementById("save-btn");
      btn.disabled = true;
      try {
        let uploaded = [];
        if (pickedFiles.length > 0) {
          showToast(`${pickedFiles.length} surat ýüklenýär...`);
          uploaded = await sbUploadFiles(pickedFiles);
        }
        const finalImgs = editId !== null ? [...editImgs, ...uploaded] : uploaded;

        const payload = {
          title,
          cat,
          price_tmt: priceTmt,
          market_compare_tmt: marketCompareTmt && !isNaN(marketCompareTmt) ? marketCompareTmt : null,
          seller,
          account_login: accountLogin || null,
          account_password: accountPassword || null,
          account_extra: accountExtra || null,
          image_urls: finalImgs,
          description,
          is_trading: cat === "CRYPTO"
        };

        if (editId !== null) {
          await sbPatch("products", editId, payload);
          showToast("Haryt täzelendi!");
        } else {
          await sbInsert("products", { ...payload, rating: 5.0, sales: 0 });
          showToast("Haryt ýerleşdirildi!");
        }
        resetForm();
        await loadSellerProducts();
      } catch (err) {
        showToast("Ýalňyşlyk: " + err.message);
      } finally {
        btn.disabled = false;
      }
    }

    async function removeItem(id) {
      if (!confirm("Bu harydy pozmak isleýärsiňizmi?")) return;
      try {
        await sbDelete("products", id);
        showToast("Haryt pozuldy.");
        await loadSellerProducts();
      } catch (err) {
        showToast("Pozulmady: " + err.message);
      }
    }

    document.getElementById("p-files").addEventListener("change", e => {
      pickedFiles = Array.from(e.target.files || []);
      const strip = document.getElementById("p-preview");
      strip.innerHTML = "";
      pickedFiles.forEach(f => {
        const u = URL.createObjectURL(f);
        const img = document.createElement("img");
        img.src = u;
        img.className = "preview-thumb";
        img.onload = () => URL.revokeObjectURL(u);
        strip.appendChild(img);
      });
    });

    document.getElementById("save-btn").addEventListener("click", saveItem);
    loadSellerProducts();
  </script>
</body>
</html>
