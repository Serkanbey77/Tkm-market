<!DOCTYPE html>
<html lang="tk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Satmak — TKM Market</title>
  <link rel="stylesheet" href="assets/tkm.css" />
</head>
<body>
  <div id="playerok-shell"></div>

  <main class="page-wrap">
    <div class="panel">
      <h2 id="form-heading">Täze Hasap / Haryt / Kurs Ýerleşdir</h2>
      <p class="muted">Oýun, programma ýa-da Trading Kurs saýlaň; hasap satylýan bolsa login/paroly giriziň.</p>

      <div class="form-grid">
        <div class="field">
          <label>Ady</label>
          <input id="p-title" type="text" placeholder="Mysal: PUBG Hasap / TikTok 1000 İzlenme" />
        </div>
        <div class="field">
          <label>Oýun / Programa / Kurs</label>
          <select id="p-platform" onchange="syncSubcatOptions()"></select>
        </div>
        <div class="field">
          <label>Bölüm (Alt kategoriýa)</label>
          <select id="p-subcat"></select>
        </div>
        <div class="field">
          <label>Baha (TMT)</label>
          <input id="p-price" type="number" step="0.01" placeholder="250" />
        </div>
        <div class="field">
          <label>Deňeşdirme bahasy (TMT)</label>
          <input id="p-compare" type="number" step="0.01" placeholder="300" />
        </div>
        <div class="field">
          <label>Satyjy ady</label>
          <input id="p-seller" type="text" oninput="this.dataset.edited='1'" />
        </div>
        <div class="field">
          <label>Suratlar (birnäçe saýlap bolýar)</label>
          <input id="p-files" type="file" accept="image/*" multiple />
          <div class="preview-list" id="p-preview"></div>
        </div>
      </div>

      <div class="escrow-box">
        <h3>Gizlin Hasap Giriş Maglumatlary</h3>
        <p class="muted">Diňe satyn alan ulanyja açylýar.</p>
        <div class="form-grid">
          <div class="field">
            <label>Hasap Ady / Login</label>
            <input id="p-login" type="text" placeholder="username ýa-da e-mail" />
          </div>
          <div class="field">
            <label>Hasap Paroly</label>
            <input id="p-pass" type="text" placeholder="••••••••" />
          </div>
          <div class="field">
            <label>Goşmaça Maglumat (2FA / Poçta)</label>
            <input id="p-extra" type="text" placeholder="Mysal: Poçta bilen berilýär" />
          </div>
        </div>
      </div>

      <div class="field" style="margin-top:12px;">
        <label>Düşündiriş</label>
        <textarea id="p-desc" rows="2" placeholder="Gysgaça maglumat..."></textarea>
      </div>

      <div class="btn-row">
        <button class="btn btn-main" id="save-btn" type="button" style="flex:1;">Ýerleşdir</button>
        <button class="btn btn-soft" id="cancel-btn" type="button" style="display:none;" onclick="resetForm()">Ýatyr</button>
      </div>
    </div>

    <div class="panel">
      <h3>Meniň Harytlarym</h3>
      <div id="seller-list"></div>
    </div>
  </main>

  <script src="assets/tkm.js"></script>
  <script>
    mountPlayerokShell("sell", "");
    let items = [];
    let editId = null;
    let editImgs = [];
    let filesPicked = [];

    function populatePlatforms() {
      const sel = document.getElementById("p-platform");
      sel.innerHTML = ALL_PLATFORMS.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("");
      syncSubcatOptions();
    }

    function syncSubcatOptions(chosen) {
      const plat = findPlatform(document.getElementById("p-platform").value);
      const subs = getSubcatsForPlatform(plat).filter(x => x !== "Ählisi");
      const subSel = document.getElementById("p-subcat");
      subSel.innerHTML = subs.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join("");
      if (chosen && subs.includes(chosen)) subSel.value = chosen;
    }

    async function loadMine() {
      try {
        items = await sbGet("products");
        setDbPill(true, "Onlaýn");
      } catch (err) {
        setDbPill(false, "Ýerli");
      }
      renderMine();
    }

    function renderMine() {
      const el = document.getElementById("seller-list");
      if (!items.length) { el.innerHTML = `<p class="muted">Heniz haryt ýok.</p>`; return; }
      el.innerHTML = items.map(p => `
        <div class="list-row">
          <div>
            <span class="chip-cat">${esc(p.platform_name || p.cat || "")}${p.subcat ? " • " + esc(p.subcat) : ""}</span>
            <strong>${esc(p.title)}</strong>
            <div class="muted">${Number(p.price_tmt || 0).toLocaleString()} TMT · Hasap: ${p.account_login ? "Bar 🔒" : "Ýok"}</div>
          </div>
          <div class="btn-row" style="margin-top:0;">
            <button class="btn btn-soft" type="button" onclick="editOne(${p.id})">Üýtget</button>
            <button class="btn btn-del" type="button" onclick="delOne(${p.id})">Poz</button>
          </div>
        </div>
      `).join("");
    }

    function resetForm() {
      editId = null;
      editImgs = [];
      filesPicked = [];
      document.getElementById("form-heading").textContent = "Täze Hasap / Haryt / Kurs Ýerleşdir";
      document.getElementById("save-btn").textContent = "Ýerleşdir";
      document.getElementById("cancel-btn").style.display = "none";
      document.getElementById("p-title").value = "";
      document.getElementById("p-price").value = "";
      document.getElementById("p-compare").value = "";
      document.getElementById("p-login").value = "";
      document.getElementById("p-pass").value = "";
      document.getElementById("p-extra").value = "";
      document.getElementById("p-files").value = "";
      document.getElementById("p-desc").value = "";
      document.getElementById("p-preview").innerHTML = "";
      syncSubcatOptions();
    }

    function editOne(id) {
      const p = items.find(x => String(x.id) === String(id));
      if (!p) return;
      editId = p.id;
      editImgs = getImages(p);
      filesPicked = [];
      document.getElementById("form-heading").textContent = `Üýtget (#${p.id})`;
      document.getElementById("save-btn").textContent = "Ýatda Sakla";
      document.getElementById("cancel-btn").style.display = "inline-block";
      document.getElementById("p-title").value = p.title || "";
      if (p.platform_id) document.getElementById("p-platform").value = p.platform_id;
      syncSubcatOptions(p.subcat);
      document.getElementById("p-price").value = p.price_tmt ?? "";
      document.getElementById("p-compare").value = p.market_compare_tmt ?? "";
      document.getElementById("p-seller").value = p.seller || getUser().username;
      document.getElementById("p-login").value = p.account_login || "";
      document.getElementById("p-pass").value = p.account_password || "";
      document.getElementById("p-extra").value = p.account_extra || "";
      document.getElementById("p-desc").value = p.description || "";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function saveOne() {
      const title = document.getElementById("p-title").value.trim();
      const plat = findPlatform(document.getElementById("p-platform").value) || ALL_PLATFORMS[0];
      const subcat = document.getElementById("p-subcat").value;
      const priceTmt = parseFloat(document.getElementById("p-price").value);
      const cmp = document.getElementById("p-compare").value.trim();
      const marketCompareTmt = cmp ? parseFloat(cmp) : null;
      const seller = document.getElementById("p-seller").value.trim() || getUser().username;
      const accountLogin = document.getElementById("p-login").value.trim();
      const accountPassword = document.getElementById("p-pass").value.trim();
      const accountExtra = document.getElementById("p-extra").value.trim();
      const description = document.getElementById("p-desc").value.trim();

      if (!title || isNaN(priceTmt) || priceTmt <= 0) {
        showToast("Ady we dogry bahany giriziň.");
        return;
      }

      const btn = document.getElementById("save-btn");
      btn.disabled = true;
      try {
        let uploaded = [];
        if (filesPicked.length > 0) {
          showToast(`${filesPicked.length} surat ýüklenýär...`);
          uploaded = await sbUpload(filesPicked);
        }
        const catCode = plat.kind === "game" ? "ACCOUNT" : (plat.kind === "course" ? "COURSE" : "DIGITAL");
        const payload = {
          title,
          cat: catCode,
          platform_id: plat.id,
          platform_name: plat.name,
          subcat,
          price_tmt: priceTmt,
          market_compare_tmt: marketCompareTmt && !isNaN(marketCompareTmt) ? marketCompareTmt : null,
          seller,
          account_login: accountLogin || null,
          account_password: accountPassword || null,
          account_extra: accountExtra || null,
          image_urls: editId !== null ? [...editImgs, ...uploaded] : uploaded,
          description,
          is_trading: plat.kind === "course"
        };

        if (editId !== null) {
          await sbPatch("products", editId, payload);
          showToast("Täzelendi!");
        } else {
          await sbInsert("products", { ...payload, rating: 5.0, sales: 0 });
          showToast("Ýerleşdirildi!");
        }
        resetForm();
        await loadMine();
      } catch (err) {
        showToast("Ýalňyşlyk: " + err.message);
      } finally {
        btn.disabled = false;
      }
    }

    async function delOne(id) {
      if (!confirm("Pozmak isleýärsiňizmi?")) return;
      try {
        await sbDelete("products", id);
        showToast("Pozuldy.");
        await loadMine();
      } catch (err) {
        showToast("Pozulmady: " + err.message);
      }
    }

    document.getElementById("p-files").addEventListener("change", e => {
      filesPicked = Array.from(e.target.files || []);
      const strip = document.getElementById("p-preview");
      strip.innerHTML = "";
      filesPicked.forEach(f => {
        const u = URL.createObjectURL(f);
        const img = document.createElement("img");
        img.src = u;
        img.className = "preview-pic";
        img.onload = () => URL.revokeObjectURL(u);
        strip.appendChild(img);
      });
    });

    document.getElementById("save-btn").addEventListener("click", saveOne);
    populatePlatforms();
    loadMine();
  </script>
</body>
</html>
