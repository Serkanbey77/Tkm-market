<!DOCTYPE html>
<html lang="tk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blockchain Pul Çek — TKM Market</title>
  <link rel="stylesheet" href="assets/tkm.css" />
  <style>
    .method-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
    @media (max-width: 600px) { .method-grid { grid-template-columns: 1fr; } }
    .method-card {
      padding: 12px;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }
    .method-card.active {
      border-color: #a855f7;
      background: rgba(168, 85, 247, 0.18);
      box-shadow: 0 0 16px rgba(168, 85, 247, 0.25);
    }
    .rate-pill {
      display: inline-block;
      margin-top: 6px;
      padding: 5px 10px;
      border-radius: 10px;
      background: rgba(52, 211, 153, 0.14);
      border: 1px solid rgba(52, 211, 153, 0.35);
      font-size: 12px;
      font-weight: 800;
      color: #6ee7b7;
    }
  </style>
</head>
<body>
  <div id="playerok-shell"></div>

  <main class="page-wrap">
    <div class="panel">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;">
        <div>
          <h2>💸 Pul Çek (Blockchain)</h2>
          <p class="muted">Çekip boljak bakiýe: <strong id="wd-cur-bal" style="color:#34d399;">0 TMT</strong></p>
        </div>
        <a class="btn btn-soft" href="profil.html">← Profile Dolan</a>
      </div>

      <form id="withdraw-form" style="margin-top:14px;">
        <div class="field">
          <label>Blockchain Ulgamyny Saýlaň</label>
          <div class="method-grid">
            <button type="button" class="method-card active" data-net="USDT BEP20" onclick="selectWdNet('USDT BEP20')">
              <strong>🪙 USDT BEP20</strong>
              <div class="muted">BNB Smart Chain (0x...)</div>
            </button>
            <button type="button" class="method-card" data-net="USDT TRC20" onclick="selectWdNet('USDT TRC20')">
              <strong>🪙 USDT TRC20</strong>
              <div class="muted">TRON Mainnet (T...)</div>
            </button>
            <button type="button" class="method-card" data-net="BTC" onclick="selectWdNet('BTC')">
              <strong>₿ Bitcoin (BTC)</strong>
              <div class="muted">BTC Mainnet (bc1... / 1...)</div>
            </button>
          </div>
        </div>

        <div class="form-grid" style="margin-top:12px;">
          <div class="field">
            <label>Çekjek Möçberiňiz (TMT) *</label>
            <input id="wd-amount" type="number" min="10" step="1" placeholder="Mysal: 200" required />
            <div class="rate-pill" id="wd-crypto-preview">Aljak kripto: 0.00 USDT</div>
          </div>
          <div class="field">
            <label id="wd-addr-label">USDT BEP20 Cüzdan Salgyňyz *</label>
            <input id="wd-wallet" type="text" placeholder="0x..." required />
          </div>
        </div>

        <div class="btn-row">
          <button type="submit" class="btn btn-main" style="width:100%; padding:13px; font-size:15px;">
            ⛓️ Blockchain Çekiş İsledigini Ugrat
          </button>
        </div>
      </form>
    </div>

    <div class="panel">
      <h3>Blockchain Çekiş Taryhyňyz</h3>
      <div id="my-withdrawals-list"></div>
    </div>
  </main>

  <script src="assets/tkm.js"></script>
  <script>
    mountPlayerokShell("profile", "", true);

    const TMT_PER_USDT = 20;
    let selectedNet = "USDT BEP20";
    let btcUsdPrice = 95000;

    async function fetchBtcPrice() {
      try {
        const res = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd");
        const data = await res.json();
        if (data?.bitcoin?.usd) {
          btcUsdPrice = Number(data.bitcoin.usd);
          updateWdPreview();
        }
      } catch (_) {}
    }

    function getPayoutCrypto(tmt, net) {
      const usd = tmt / TMT_PER_USDT;
      if (net === "USDT BEP20" || net === "USDT TRC20") {
        return { amount: Number(usd.toFixed(2)), symbol: "USDT" };
      }
      return { amount: Number((usd / btcUsdPrice).toFixed(6)), symbol: "BTC" };
    }

    function selectWdNet(net) {
      selectedNet = net;
      document.querySelectorAll(".method-card").forEach(c => {
        c.classList.toggle("active", c.dataset.net === net);
      });
      const lbl = document.getElementById("wd-addr-label");
      const inp = document.getElementById("wd-wallet");
      lbl.textContent = `${net} Cüzdan Salgyňyz *`;
      if (net === "USDT BEP20") inp.placeholder = "0x... (42 simwol)";
      else if (net === "USDT TRC20") inp.placeholder = "T... (34 simwol)";
      else inp.placeholder = "bc1... ýa-da 1... / 3...";
      updateWdPreview();
    }

    function updateWdPreview() {
      const amt = Math.max(0, Number(document.getElementById("wd-amount").value || 0));
      const p = getPayoutCrypto(amt, selectedNet);
      document.getElementById("wd-crypto-preview").textContent = `Aljak kripto: ${p.amount} ${p.symbol}`;
    }

    function isValidWalletForNetwork(addr, net) {
      if (net === "USDT BEP20") return /^0x[a-fA-F0-9]{40}$/.test(addr);
      if (net === "USDT TRC20") return /^T[1-9A-HJ-NP-Za-km-z]{33}$/.test(addr);
      if (net === "BTC") return /^(bc1|[13])[a-zA-HJ-NP-Z0-9]{25,62}$/.test(addr);
      return false;
    }

    document.getElementById("wd-amount").addEventListener("input", updateWdPreview);

    document.getElementById("withdraw-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!requireVerifiedUser("profil.html")) return;

      const user = getUser();
      const amountTmt = Number(document.getElementById("wd-amount").value || 0);
      const walletAddr = document.getElementById("wd-wallet").value.trim();

      if (!amountTmt || amountTmt < 10) {
        showToast("İň az çekiş möçberi 10 TMT!");
        return;
      }
      if (!isValidWalletForNetwork(walletAddr, selectedNet)) {
        showToast(`Girizen salgyňyz dogry ${selectedNet} blockchain salgysy däl!`);
        return;
      }

      const payout = getPayoutCrypto(amountTmt, selectedNet);
      const payload = {
        seller: user.username,
        amount_tmt: amountTmt,
        method: "Crypto",
        network_or_coin: `${selectedNet} (${payout.amount} ${payout.symbol})`,
        wallet_or_card: walletAddr,
        status: "pending"
      };

      let savedRow = null;
      try {
        savedRow = await sbInsert("withdrawals", payload);
      } catch (_) {
        savedRow = { id: "wd-" + Date.now(), ...payload };
      }

      let cache = [];
      try { cache = JSON.parse(localStorage.getItem("tkm_withdrawals_cache") || "[]"); } catch (__) {}
      cache.unshift(savedRow);
      localStorage.setItem("tkm_withdrawals_cache", JSON.stringify(cache));

      document.getElementById("wd-amount").value = "";
      document.getElementById("wd-wallet").value = "";
      updateWdPreview();
      showToast(`${selectedNet} çekiş islegi ugradyldy (${payout.amount} ${payout.symbol})!`);
      await refreshWithdrawalsView();
    });

    async function refreshWithdrawalsView() {
      await refreshTopBalancePill();
      const pillTxt = document.getElementById("top-balance-pill")?.textContent || "💰 0 TMT";
      document.getElementById("wd-cur-bal").textContent = pillTxt.replace("💰 ", "");

      const user = getUser();
      let list = [];
      try {
        list = await sbGet("withdrawals");
        localStorage.setItem("tkm_withdrawals_cache", JSON.stringify(list));
      } catch (_) {
        try { list = JSON.parse(localStorage.getItem("tkm_withdrawals_cache") || "[]"); } catch (__) {}
      }

      const mine = user.loggedIn
        ? list.filter(x => String(x.seller || "").toLowerCase() === String(user.username || "").toLowerCase())
        : list.slice(0, 10);

      const wrap = document.getElementById("my-withdrawals-list");
      if (!mine.length) {
        wrap.innerHTML = `<p class="muted">Heniz çekiş islegi ýok.</p>`;
        return;
      }

      wrap.innerHTML = mine.map(w => {
        const st = w.status === "approved" ? "Tassyklanyldy ✅" : (w.status === "rejected" ? "Ret Edildi ❌" : "Blockchain Ugradylýar ⏳");
        return `
          <div class="list-row">
            <div>
              <strong>${Number(w.amount_tmt || 0).toLocaleString()} TMT</strong> — <span class="chip-cat">${esc(w.network_or_coin || w.method)}</span>
              <div class="muted" style="word-break:break-all;">${esc(w.wallet_or_card || "")}</div>
            </div>
            <span class="badge-status ${w.status === "approved" ? "ok" : ""}">${st}</span>
          </div>
        `;
      }).join("");
    }

    fetchBtcPrice();
    selectWdNet("USDT BEP20");
    refreshWithdrawalsView();
  </script>
</body>
</html>
