<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TKM Market — Bakiye Çek</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #070b14; color: #f8fafc; padding: 16px; }
    .wrap { max-width: 480px; margin: 0 auto; }
    .card { background: #111827; border: 1px solid #1e293b; border-radius: 16px; padding: 18px; }
    h1 { font-size: 19px; color: #38bdf8; margin: 0 0 8px; }
    .bal { font-size: 22px; font-weight: 800; color: #22c55e; margin-bottom: 14px; }
    label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px; }
    input, select {
      width: 100%; background: #0b1120; border: 1px solid #283548; color: #fff;
      padding: 11px; border-radius: 10px; margin-bottom: 12px; font-size: 14px;
    }
    button {
      width: 100%; padding: 12px; border: none; border-radius: 10px;
      background: #2563eb; color: #fff; font-weight: 700; font-size: 14px; cursor: pointer;
    }
    .msg { font-size: 13px; margin-top: 10px; }
    a { color: #38bdf8; text-decoration: none; font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div style="margin-bottom:10px;"><a href="profil.html">← Profile Dön</a></div>
    <div class="card">
      <h1>Bakiye Çekim Talebi</h1>
      <div class="bal" id="curBal">Bakiye: $0.00</div>

      <label>Çekim Yöntemi</label>
      <select id="method">
        <option value="USDT_BEP20">USDT (BEP20)</option>
        <option value="KART_TRANSFER">Kart / Hesap Transferi</option>
      </select>

      <label>Çekilecek Tutar ($ USD)</label>
      <input type="number" id="amount" min="1" step="0.01" placeholder="Örn: 10.00" />

      <label>Cüzdan Adresi / Hesap Bilgisi</label>
      <input type="text" id="address" placeholder="BEP20 cüzdan adresi veya hesap bilgisi" />

      <button onclick="submitWithdraw()">Çekim Talebi Oluştur</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://piajbopfeqlyupkrsnik.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_gQFoj3SUxW-TUMjYmTGrIg_5_6hwBAH";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentUser = null;
    let currentBalance = 0;

    async function loadBal() {
      const { data: { user } } = await sb.auth.getUser();
      if (!user) return;
      currentUser = user;
      const { data: prof } = await sb.from("profiles").select("balance").eq("id", user.id).single();
      currentBalance = Number(prof?.balance || 0);
      document.getElementById("curBal").innerText = `Bakiye: $${currentBalance.toFixed(2)}`;
    }

    async function submitWithdraw() {
      const msg = document.getElementById("msg");
      if (!currentUser) {
        msg.innerHTML = `<span style="color:#f87171;">Önce <a href="profil.html">giriş yapmalısın</a>.</span>`;
        return;
      }

      const amount = Number(document.getElementById("amount").value);
      const method = document.getElementById("method").value;
      const payout_address = document.getElementById("address").value.trim();

      if (!amount || amount <= 0 || amount > currentBalance) {
        msg.innerHTML = `<span style="color:#f87171;">Yetersiz bakiye veya geçersiz tutar.</span>`;
        return;
      }
      if (!payout_address) {
        msg.innerHTML = `<span style="color:#f87171;">Cüzdan/hesap bilgisini gir.</span>`;
        return;
      }

      const nextBal = Number((currentBalance - amount).toFixed(2));
      const { error: pErr } = await sb.from("profiles").update({ balance: nextBal }).eq("id", currentUser.id);
      if (pErr) {
        msg.innerHTML = `<span style="color:#f87171;">Bakiye düşülemedi: ${pErr.message}</span>`;
        return;
      }

      const { error: wErr } = await sb.from("withdrawals").insert({
        user_id: currentUser.id,
        email: currentUser.email,
        amount,
        method,
        payout_address,
        status: "pending"
      });

      if (wErr) {
        msg.innerHTML = `<span style="color:#f87171;">Talep hatası: ${wErr.message}</span>`;
      } else {
        currentBalance = nextBal;
        document.getElementById("curBal").innerText = `Bakiye: $${currentBalance.toFixed(2)}`;
        msg.innerHTML = `<span style="color:#4ade80;">Çekim talebin alındı ve admin onayına gönderildi.</span>`;
        document.getElementById("amount").value = "";
        document.getElementById("address").value = "";
      }
    }

    loadBal();
  </script>
</body>
</html>
