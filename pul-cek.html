<!DOCTYPE html>
<html lang="tk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Çykarmak — TKM Market</title>
  <link rel="stylesheet" href="assets/tkm.css" />
  <style>
    .bal-top-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .bal-tab {
      padding: 12px;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-weight: 900;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    .bal-tab.active {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      border-color: transparent;
      color: #fff;
    }
    .bal-hero-card {
      padding: 16px;
      border-radius: 16px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      margin-bottom: 12px;
    }
    .bal-hero-label { font-size: 13px; color: var(--muted); font-weight: 700; }
    .bal-hero-val { font-size: 24px; font-weight: 900; color: #34d399; margin-top: 4px; }
    .net-pills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    @media (max-width: 600px) { .net-pills { grid-template-columns: 1fr; } }
    .net-pill {
      padding: 11px 8px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-weight: 800;
      cursor: pointer;
      text-align: center;
    }
    .net-pill.active {
      border-color: #3b82f6;
      background: rgba(59, 130, 246, 0.18);
      color: #93c5fd;
    }
    .conv-badge {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 10px;
      border-radius: 10px;
      background: rgba(52, 211, 153, 0.14);
      border: 1px solid rgba(52, 211, 153, 0.35);
      font-size: 12px;
      font-weight: 800;
      color: #6ee7b7;
    }
  </style>
</head>
<body>
  <div id="playerok-shell"></div>

  <main class="page-wrap">
    <div class="panel">
      <div class="bal-top-tabs">
        <a class="bal-tab" href="bakiye-yatir.html">Bakiýe Ýatyr</a>
        <button type="button" class="bal-tab active">Çykarmak</button>
      </div>

      <div class="bal-hero-card">
        <div class="bal-hero-label">Çykaryp Boljak Bakiýe</div>
        <div class="bal-hero-val" id="wd-cur-bal">0 TMT</div>
      </div>

      <form id="withdraw-form">
        <div class="bal-hero-card">
          <div style="font-weight:900; font-size:15px;">Blockchain Ulgamyny Saýlaň</div>
          <div class="net-pills">
            <button type="button" class="net-pill active" data-net="USDT BEP20" onclick="selectWdNet('USDT BEP20')">USDT BEP20</button>
            <button type="button" class="net-pill" data-net="USDT TRC20" onclick="selectWdNet('USDT TRC20')">USDT TRC20</button>
            <button type="button" class="net-pill" data-net="BTC" onclick="selectWdNet('BTC')">Bitcoin (BTC)</button>
          </div>

          <div class="field" style="margin-top:12px;">
            <label>Çekmek Möçberi (TMT) *</label>
            <input id="wd-amount" type="number" min="10" step="1" placeholder="Mysal: 200" required />
            <div class="conv-badge" id="wd-crypto-preview">Aljak mukdaryňyz: 0.00 USDT</div>
          </div>

          <div class="field" style="margin-top:12px;">
            <label id="wd-addr-label">USDT BEP20 Cüzdan Salgyňyz *</label>
            <input id="wd-wallet" type="text" placeholder="0x..." required />
          </div>

          <div class="btn-row">
            <button type="submit" class="btn btn-main" style="width:100%; padding:13px; font-size:15px;">
              Çykarmak İsledigini Ugrat
            </button>
          </div>
        </div>
      </form>
    </div>

    <div class="panel">
      <h3>Taryh (Çekişler)</h3>
      <div id="my-withdrawals-list"></div>
    </div>
  </main>

  <script src="assets/tkm.js"></script>
  <script>
    mountPlayerokShell("profile", "", true);

    const TMT_PER_USDT = 20;
    let selectedNet = "USDT BEP20";
    let btcUsdPrice = 95000;

    async function fetchBtcPrice() {
      try {
        const res = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd");
        const data = await res.json();
        if (data?.bitcoin?.usd) {
          btcUsdPrice = Number(data.bitcoin.usd);
          updateWdPreview();
        }
      } catch (_) {}
    }

    function getPayoutCrypto(tmt, net) {
      const usd = tmt / TMT_PER_USDT;
      if (net === "BTC") return { amount: Number((usd / btcUsdPrice).toFixed(6)), unit: "BTC" };
      return { amount: Number(usd.toFixed(2)), unit: "USDT" };
    }

    function selectWdNet(net) {
      selectedNet = net;
      document.querySelectorAll(".net-pill").forEach(p => {
        p.classList.toggle("active", p.dataset.net === net);
      });
      const lbl = document.getElementById("wd-addr-label");
      const inp = document.getElementById("wd-wallet");
      lbl.textContent = `${net} Cüzdan Salgyňyz *`;
      if (net === "USDT BEP20") inp.placeholder = "0x... (42 simwol)";
      else if (net === "USDT TRC20") inp.placeholder = "T... (34 simwol)";
      else inp.placeholder = "bc1... ýa-da 1... / 3...";
      updateWdPreview();
    }

    function updateWdPreview() {
      const amt = Math.max(0, Number(document.getElementById("wd-amount").value || 0));
      const p = getPayoutCrypto(amt, selectedNet);
      document.getElementById("wd-crypto-preview").textContent = `Aljak mukdaryňyz: ${p.amount} ${p.unit}`;
    }

    function isValidWalletForNetwork(addr, net) {
      if (net === "USDT BEP20") return /^0x[a-fA-F0-9]{40}$/.test(addr);
      if (net === "USDT TRC20") return /^T[1-9A-HJ-NP-Za-km-z]{33}$/.test(addr);
      if (net === "BTC") return /^(bc1|[13])[a-zA-HJ-NP-Z0-9]{25,62}$/.test(addr);
      return false;
    }

    document.getElementById("wd-amount").addEventListener("input", updateWdPreview);

    document.getElementById("withdraw-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!requireVerifiedUser("profil.html")) return;

      const user = getUser();
      const amountTmt = Number(document.getElementById("wd-amount").value || 0);
      const walletAddr = document.getElementById("wd-wallet").value.trim();

      if (!amountTmt || amountTmt < 10) {
        showToast("İň az çekiş möçberi 10 TMT!");
        return;
      }
      if (!isValidWalletForNetwork(walletAddr, selectedNet)) {
        showToast(`Girizen salgyňyz dogry ${selectedNet} blockchain salgysy däl!`);
        return;
      }

      const payout = getPayoutCrypto(amountTmt, selectedNet);
      const payload = {
        seller: user.username,
        amount_tmt: amountTmt,
        method: "Crypto",
        network_or_coin: `${selectedNet} (${payout.amount} ${payout.unit})`,
        wallet_or_card: walletAddr,
        status: "pending"
      };

      let savedRow = null;
      try { savedRow = await sbInsert("withdrawals", payload); }
      catch (_) { savedRow = { id: "wd-" + Date.now(), ...payload }; }

      let cache = [];
      try { cache = JSON.parse(localStorage.getItem("tkm_withdrawals_cache") || "[]"); } catch (__) {}
      cache.unshift(savedRow);
      localStorage.setItem("tkm_withdrawals_cache", JSON.stringify(cache));

      document.getElementById("wd-amount").value = "";
      document.getElementById("wd-wallet").value = "";
      updateWdPreview();
      showToast(`${selectedNet} çekiş islegi ugradyldy (${payout.amount} ${payout.unit})!`);
      await refreshWithdrawalsView();
    });

    async function refreshWithdrawalsView() {
      await refreshTopBalancePill();
      const pillTxt = document.getElementById("top-balance-pill")?.textContent || "💰 0 TMT";
      document.getElementById("wd-cur-bal").textContent = pillTxt.replace("💰 ", "");

      const user = getUser();
      let list = [];
      try {
        list = await sbGet("withdrawals");
        localStorage.setItem("tkm_withdrawals_cache", JSON.stringify(list));
      } catch (_) {
        try { list = JSON.parse(localStorage.getItem("tkm_withdrawals_cache") || "[]"); } catch (__) {}
      }

      const mine = user.loggedIn
        ? list.filter(x => String(x.seller || "").toLowerCase() === String(user.username || "").toLowerCase())
        : list.slice(0, 10);

      const wrap = document.getElementById("my-withdrawals-list");
      if (!mine.length) {
        wrap.innerHTML = `<p class="muted">Heniz çekiş taryhy ýok.</p>`;
        return;
      }

      wrap.innerHTML = mine.map(w => {
        const st = w.status === "approved" ? "Tassyklanyldy ✅" : (w.status === "rejected" ? "Ret Edildi ❌" : "Ugradylýar ⏳");
        return `
          <div class="list-row">
            <div>
              <strong>${Number(w.amount_tmt || 0).toLocaleString()} TMT</strong> — <span class="chip-cat">${esc(w.network_or_coin || w.method)}</span>
              <div class="muted" style="word-break:break-all;">${esc(w.wallet_or_card || "")}</div>
            </div>
            <span class="badge-status ${w.status === "approved" ? "ok" : ""}">${st}</span>
          </div>
        `;
      }).join("");
    }

    fetchBtcPrice();
    selectWdNet("USDT BEP20");
    refreshWithdrawalsView();
  </script>
</body>
</html>
