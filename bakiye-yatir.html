<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TKM Market — Bakiye Yatır</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #070b14; color: #f8fafc; padding: 16px; }
    .wrap { max-width: 480px; margin: 0 auto; }
    .card { background: #111827; border: 1px solid #1e293b; border-radius: 16px; padding: 18px; margin-bottom: 14px; }
    h1 { font-size: 19px; color: #38bdf8; margin: 0 0 12px; }
    label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px; }
    input, select {
      width: 100%; background: #0b1120; border: 1px solid #283548; color: #fff;
      padding: 11px; border-radius: 10px; margin-bottom: 12px; font-size: 14px;
    }
    .info-box {
      background: #0b1324; border: 1px dashed #2563eb; border-radius: 12px;
      padding: 12px; font-size: 12px; color: #cbd5e1; margin-bottom: 14px; line-height: 1.5;
    }
    button {
      width: 100%; padding: 12px; border: none; border-radius: 10px;
      background: #16a34a; color: #fff; font-weight: 700; font-size: 14px; cursor: pointer;
    }
    .msg { font-size: 13px; margin-top: 10px; }
    a { color: #38bdf8; text-decoration: none; font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div style="margin-bottom:10px;"><a href="profil.html">← Profile Dön</a></div>
    <div class="card">
      <h1>Güvenli Bakiye Yatırma</h1>
      <div class="info-box">
        <strong>Ödeme Bilgisi:</strong><br>
        • <strong>USDT (BEP20):</strong> <code>0xCüzdanAdresiniBurayaYaz</code><br>
        • <strong>Kart / Havale:</strong> Talebi oluşturduktan sonra referans kodunu kaydet; onaylandığında bakiyen cüzdanına yansır.
      </div>

      <label>Ödeme Yöntemi</label>
      <select id="method">
        <option value="USDT_BEP20">USDT (BEP20)</option>
        <option value="VISA_MASTERCARD">Visa / Mastercard</option>
        <option value="HAVALE_EFT">Banka / Kart Transferi</option>
      </select>

      <label>Yatırılacak Tutar ($ USD)</label>
      <input type="number" id="amount" min="1" step="0.01" placeholder="Örn: 25.00" />

      <label>İşlem ID / Dekont Referansı</label>
      <input type="text" id="txRef" placeholder="TxHash veya işlem referansı" />

      <button onclick="submitDeposit()">Yatırım Talebi Gönder</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://piajbopfeqlyupkrsnik.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_gQFoj3SUxW-TUMjYmTGrIg_5_6hwBAH";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function submitDeposit() {
      const msg = document.getElementById("msg");
      const { data: { user } } = await sb.auth.getUser();
      if (!user) {
        msg.innerHTML = `<span style="color:#f87171;">Önce <a href="profil.html">giriş yapmalısın</a>.</span>`;
        return;
      }

      const amount = Number(document.getElementById("amount").value);
      const method = document.getElementById("method").value;
      const tx_ref = document.getElementById("txRef").value.trim();

      if (!amount || amount <= 0) {
        msg.innerHTML = `<span style="color:#f87171;">Geçerli bir tutar gir.</span>`;
        return;
      }

      const { error } = await sb.from("deposits").insert({
        user_id: user.id,
        email: user.email,
        amount,
        method,
        tx_ref,
        status: "pending"
      });

      if (error) {
        msg.innerHTML = `<span style="color:#f87171;">Hata: ${error.message}</span>`;
      } else {
        msg.innerHTML = `<span style="color:#4ade80;">Talep alındı! Onaylandığında bakiyene eklenecek.</span>`;
        document.getElementById("amount").value = "";
        document.getElementById("txRef").value = "";
      }
    }
  </script>
</body>
</html>
