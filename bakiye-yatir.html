<!DOCTYPE html>
<html lang="tk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para Yatır — TKM Market</title>
  <link rel="stylesheet" href="assets/tkm.css" />
  <style>
    .preset-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .preset-btn {
      padding: 11px 8px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-weight: 800;
      cursor: pointer;
    }
    .preset-btn.active {
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.18);
      color: #6ee7b7;
    }
    .method-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
    .method-card {
      padding: 12px;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }
    .method-card.active {
      border-color: #a855f7;
      background: rgba(168, 85, 247, 0.18);
      box-shadow: 0 0 16px rgba(168, 85, 247, 0.25);
    }
    .pay-box {
      margin-top: 12px;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface-2);
    }
    .card-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  </style>
</head>
<body>
  <div id="playerok-shell"></div>

  <main class="page-wrap">
    <div class="panel">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;">
        <div>
          <h2>💳 Bakiýe Ýatyr (Para Yatır)</h2>
          <p class="muted">Hasabyňyza tiz we aňsat bakiýe goşuň. Aktiw bakiýe: <strong id="dep-cur-bal" style="color:#34d399;">0 TMT</strong></p>
        </div>
        <a class="btn btn-soft" href="profil.html">← Profile Dolan</a>
      </div>

      <form id="deposit-form" style="margin-top:14px;">
        <div class="field">
          <label>Taýyn Möçber Saýlaň (TMT)</label>
          <div class="preset-grid">
            <button type="button" class="preset-btn active" onclick="setDepAmount(50, this)">50 TMT</button>
            <button type="button" class="preset-btn" onclick="setDepAmount(100, this)">100 TMT</button>
            <button type="button" class="preset-btn" onclick="setDepAmount(250, this)">250 TMT</button>
            <button type="button" class="preset-btn" onclick="setDepAmount(500, this)">500 TMT</button>
            <button type="button" class="preset-btn" onclick="setDepAmount(1000, this)">1.000 TMT</button>
            <button type="button" class="preset-btn" onclick="setDepAmount(2500, this)">2.500 TMT</button>
          </div>
        </div>

        <div class="field" style="margin-top:12px;">
          <label>Ýatyrjak Möçberiňiz (TMT) *</label>
          <input id="dep-amount" type="number" min="1" step="1" value="50" required />
        </div>

        <div class="field" style="margin-top:12px;">
          <label>Töleg Usulyny Saýlaň</label>
          <div class="method-grid">
            <button type="button" class="method-card active" data-m="visa" onclick="selectDepMethod('visa')">
              <strong>💳 Visa Card</strong>
              <div class="muted">Kart maglumatlary bilen</div>
            </button>
            <button type="button" class="method-card" data-m="mastercard" onclick="selectDepMethod('mastercard')">
              <strong>💳 Mastercard</strong>
              <div class="muted">Kart maglumatlary bilen</div>
            </button>
            <button type="button" class="method-card" data-m="usdt_bep20" onclick="selectDepMethod('usdt_bep20')">
              <strong>🪙 USDT BEP20</strong>
              <div class="muted">BNB Smart Chain (BSC)</div>
            </button>
            <button type="button" class="method-card" data-m="usdt_trc20" onclick="selectDepMethod('usdt_trc20')">
              <strong>🪙 USDT TRC20</strong>
              <div class="muted">TRON ulgamy</div>
            </button>
            <button type="button" class="method-card" data-m="btc" onclick="selectDepMethod('btc')">
              <strong>₿ Bitcoin (BTC)</strong>
              <div class="muted">BTC ulgamy</div>
            </button>
            <button type="button" class="method-card" data-m="ton" onclick="selectDepMethod('ton')">
              <strong>💎 Toncoin (TON)</strong>
              <div class="muted">TON ulgamy</div>
            </button>
          </div>
        </div>

        <!-- Seçilen Yönteme Göre Dinamik Alanlar -->
        <div class="pay-box" id="dep-dynamic-fields"></div>

        <div class="btn-row">
          <button type="submit" class="btn btn-green" style="width:100%; padding:13px; font-size:15px;">
            Tölegi Tassyklap Bakiýä Goş
          </button>
        </div>
      </form>
    </div>

    <div class="panel">
      <h3>Soňky Bakiýe Ýatyrmalaryňyz</h3>
      <div id="my-deposits-list"></div>
    </div>
  </main>

  <script src="assets/tkm.js"></script>
  <script>
    mountPlayerokShell("profile", "", true);

    const CRYPTO_ADDRS = {
      usdt_bep20: { title: "USDT (BEP20 / BSC) Salgysy", addr: "0x8f4C92e1A73b50d6C9412e77B10a5F4c29E81034", note: "Diňe BEP20 (BSC) ulgamyndan ugradyň." },
      usdt_trc20: { title: "USDT (TRC20 / TRON) Salgysy", addr: "TQn9Y2khEsLJW1ChVWFMSMeRDow5KcbLSE", note: "Diňe TRC20 (TRON) ulgamyndan ugradyň." },
      btc:        { title: "Bitcoin (BTC) Salgysy", addr: "bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh", note: "Diňe Bitcoin ulgamyndan ugradyň." },
      ton:        { title: "Toncoin (TON) Salgysy", addr: "UQD7v4k9m2p8x1z6c3v5b7n9m1q2w3e4r5t6y7u8i9o0p", note: "TON ulgamyndan ugradyň." }
    };

    let selectedMethod = "visa";

    function setDepAmount(val, btn) {
      document.getElementById("dep-amount").value = val;
      document.querySelectorAll(".preset-btn").forEach(b => b.classList.remove("active"));
      if (btn) btn.classList.add("active");
      renderDynamicPaymentFields();
    }

    function selectDepMethod(m) {
      selectedMethod = m;
      document.querySelectorAll(".method-card").forEach(c => {
        c.classList.toggle("active", c.dataset.m === m);
      });
      renderDynamicPaymentFields();
    }

    function renderDynamicPaymentFields() {
      const box = document.getElementById("dep-dynamic-fields");
      const amt = Math.max(0, Number(document.getElementById("dep-amount").value || 0));

      if (selectedMethod === "visa" || selectedMethod === "mastercard") {
        const brandLabel = selectedMethod === "visa" ? "Visa Card" : "Mastercard";
        box.innerHTML = `
          <div style="font-weight:800; margin-bottom:8px;">${brandLabel} Maglumatlary</div>
          <div class="field">
            <label>Kart Belgisi (16 san) *</label>
            <input id="card-number" type="text" inputmode="numeric" maxlength="19" placeholder="4532 •••• •••• ••••" required />
          </div>
          <div class="card-row-2">
            <div class="field">
              <label>Möhleti (AA/ÝÝ) *</label>
              <input id="card-exp" type="text" maxlength="5" placeholder="08/29" required />
            </div>
            <div class="field">
              <label>CVV / CVC *</label>
              <input id="card-cvv" type="password" inputmode="numeric" maxlength="4" placeholder="123" required />
            </div>
          </div>
          <div class="field" style="margin-top:10px;">
            <label>Kartyň Eýesiniň Ady *</label>
            <input id="card-holder" type="text" placeholder="AD FAMILÝA" required />
          </div>
          <div class="muted" style="margin-top:8px;">Tölenjek möçber: <strong>${amt.toLocaleString()} TMT</strong></div>
        `;
        return;
      }

      const info = CRYPTO_ADDRS[selectedMethod];
      box.innerHTML = `
        <div style="font-weight:800; margin-bottom:4px;">${info.title}</div>
        <div class="muted">${info.note}</div>
        <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:10px; padding:10px; border-radius:10px; background:rgba(0,0,0,0.22); word-break:break-all;">
          <code id="crypto-addr-text" style="font-size:12px;">${info.addr}</code>
          <button type="button" class="btn btn-soft" onclick="copyCryptoAddr()">Kopyala</button>
        </div>
        <div class="field" style="margin-top:10px;">
          <label>Gönderen Salgyňyz ýa-da Bellik (İsteğe bağlı)</label>
          <input id="crypto-sender-note" type="text" placeholder="Mysal: Binance / TrustWallet" />
        </div>
        <div class="muted" style="margin-top:8px;">Hasaba geçjek möçber: <strong>${amt.toLocaleString()} TMT</strong></div>
      `;
    }

    function copyCryptoAddr() {
      const txt = document.getElementById("crypto-addr-text")?.textContent || "";
      if (navigator.clipboard && txt) {
        navigator.clipboard.writeText(txt).catch(() => {});
      }
      showToast("Salgy göçürildi!");
    }

    document.getElementById("dep-amount").addEventListener("input", renderDynamicPaymentFields);

    document.getElementById("deposit-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!requireVerifiedUser("profil.html")) return;

      const user = getUser();
      const amountTmt = Number(document.getElementById("dep-amount").value || 0);
      if (!amountTmt || amountTmt <= 0) {
        showToast("Dogry möçber giriziň!");
        return;
      }

      let refInfo = selectedMethod.toUpperCase();
      if (selectedMethod === "visa" || selectedMethod === "mastercard") {
        const num = (document.getElementById("card-number")?.value || "").replace(/\s+/g, "");
        const exp = (document.getElementById("card-exp")?.value || "").trim();
        const cvv = (document.getElementById("card-cvv")?.value || "").trim();
        const holder = (document.getElementById("card-holder")?.value || "").trim();
        if (num.length < 12 || !exp || cvv.length < 3 || !holder) {
          showToast("Kart maglumatlaryny doly giriziň!");
          return;
        }
        refInfo = `${selectedMethod.toUpperCase()} •••• ${num.slice(-4)} (${holder})`;
      } else {
        const note = (document.getElementById("crypto-sender-note")?.value || "").trim();
        refInfo = note ? `${selectedMethod.toUpperCase()} — ${note}` : selectedMethod.toUpperCase();
      }

      const payload = {
        username: user.username,
        amount_tmt: amountTmt,
        method: selectedMethod.toUpperCase(),
        reference_info: refInfo,
        status: "approved"
      };

      let savedRow = null;
      try {
        savedRow = await sbInsert("deposits", payload);
      } catch (_) {
        savedRow = { id: "dep-" + Date.now(), ...payload };
      }

      let cache = [];
      try { cache = JSON.parse(localStorage.getItem("tkm_deposits_cache") || "[]"); } catch (__) {}
      cache.unshift(savedRow);
      localStorage.setItem("tkm_deposits_cache", JSON.stringify(cache));

      showToast(`+${amountTmt.toLocaleString()} TMT bakiýäňize goşuldy!`);
      await refreshWalletAndList();
    });

    async function refreshWalletAndList() {
      await refreshTopBalancePill();
      const pillTxt = document.getElementById("top-balance-pill")?.textContent || "💰 0 TMT";
      document.getElementById("dep-cur-bal").textContent = pillTxt.replace("💰 ", "");

      const user = getUser();
      let list = [];
      try {
        list = await sbGet("deposits");
        localStorage.setItem("tkm_deposits_cache", JSON.stringify(list));
      } catch (_) {
        try { list = JSON.parse(localStorage.getItem("tkm_deposits_cache") || "[]"); } catch (__) {}
      }

      const mine = user.loggedIn
        ? list.filter(x => String(x.username || "").toLowerCase() === String(user.username || "").toLowerCase())
        : list.slice(0, 10);

      const wrap = document.getElementById("my-deposits-list");
      if (!mine.length) {
        wrap.innerHTML = `<p class="muted">Heniz bakiýe ýatyryş ýok.</p>`;
        return;
      }

      wrap.innerHTML = mine.map(d => `
        <div class="list-row">
          <div>
            <strong>+${Number(d.amount_tmt || 0).toLocaleString()} TMT</strong> — <span class="chip-cat">${esc(d.method)}</span>
            <div class="muted">${esc(d.reference_info || "")}</div>
          </div>
          <span class="badge-status ok">${d.status === "rejected" ? "Ret Edildi ❌" : "Bakiýede ✅"}</span>
        </div>
      `).join("");
    }

    renderDynamicPaymentFields();
    refreshWalletAndList();
  </script>
</body>
</html>
