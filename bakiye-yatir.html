<!DOCTYPE html>
<html lang="tk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bakiýe — TKM Market</title>
  <link rel="stylesheet" href="assets/tkm.css" />
  <style>
    .bal-top-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .bal-tab {
      padding: 12px;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-weight: 900;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    .bal-tab.active {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      border-color: transparent;
      color: #fff;
    }
    .bal-hero-card {
      padding: 16px;
      border-radius: 16px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      margin-bottom: 12px;
    }
    .bal-hero-label { font-size: 13px; color: var(--muted); font-weight: 700; }
    .bal-hero-val { font-size: 24px; font-weight: 900; color: #34d399; margin-top: 4px; }
    .preset-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .preset-chip {
      padding: 10px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-weight: 800;
      cursor: pointer;
    }
    .preset-chip.active { border-color: #3b82f6; background: rgba(59, 130, 246, 0.18); color: #93c5fd; }
    .pay-method-list { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
    .pay-method-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      cursor: pointer;
      text-align: left;
      width: 100%;
    }
    .pay-method-item.active { border-color: #3b82f6; background: rgba(59, 130, 246, 0.15); }
    .radio-dot {
      width: 22px; height: 22px; border-radius: 999px;
      border: 2px solid var(--muted);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 900; flex-shrink: 0;
    }
    .pay-method-item.active .radio-dot {
      background: #2563eb; border-color: #2563eb; color: #fff;
    }
    .checkout-panel {
      margin-top: 14px;
      padding: 16px;
      border-radius: 16px;
      border: 1.5px solid rgba(59, 130, 246, 0.45);
      background: var(--surface-2);
    }
    .net-pills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    .net-pill {
      padding: 10px 8px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-weight: 800;
      cursor: pointer;
      text-align: center;
    }
    .net-pill.active { border-color: #8b5cf6; background: rgba(139, 92, 246, 0.2); color: #ddd6fe; }
    .addr-copy-box {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      padding: 12px; border-radius: 12px; background: rgba(0,0,0,0.22);
      margin-top: 10px; word-break: break-all;
    }
    .card-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  </style>
</head>
<body>
  <div id="playerok-shell"></div>

  <main class="page-wrap">
    <div class="panel">
      <div class="bal-top-tabs">
        <button type="button" class="bal-tab active">Bakiýe Ýatyr</button>
        <a class="bal-tab" href="pul-cek.html">Çykarmak</a>
      </div>

      <div class="bal-hero-card">
        <div class="bal-hero-label">Bakiýe</div>
        <div class="bal-hero-val" id="dep-cur-bal">0 TMT</div>
      </div>

      <div class="bal-hero-card">
        <div class="bal-hero-label">Ýatyrmak Möçberi (TMT)</div>
        <input id="dep-amount" type="number" min="1" step="1" value="100"
          style="margin-top:6px; width:100%; font-size:20px; font-weight:900; padding:10px; border-radius:12px; border:1px solid var(--border); background:var(--surface); color:var(--text);" />
        <div class="preset-row">
          <button type="button" class="preset-chip" onclick="pickAmt(50, this)">50 TMT</button>
          <button type="button" class="preset-chip active" onclick="pickAmt(100, this)">100 TMT</button>
          <button type="button" class="preset-chip" onclick="pickAmt(250, this)">250 TMT</button>
          <button type="button" class="preset-chip" onclick="pickAmt(500, this)">500 TMT</button>
          <button type="button" class="preset-chip" onclick="pickAmt(1000, this)">1.000 TMT</button>
          <button type="button" class="preset-chip" onclick="pickAmt(2500, this)">2.500 TMT</button>
        </div>
      </div>

      <div class="bal-hero-card">
        <div style="font-weight:900; font-size:15px;">Töleg Usullary</div>
        <div class="pay-method-list">
          <button type="button" class="pay-method-item active" data-pay="crypto" onclick="choosePayGroup('crypto')">
            <div>
              <strong>⛓️ Kriptowalýuta</strong>
              <div class="muted">USDT BEP20 · USDT TRC20 · Bitcoin (BTC)</div>
            </div>
            <span class="radio-dot">✓</span>
          </button>

          <button type="button" class="pay-method-item" data-pay="card" onclick="choosePayGroup('card')">
            <div>
              <strong>💳 Bank Karty</strong>
              <div class="muted">Visa / Mastercard / Daşary ýurt karty</div>
            </div>
            <span class="radio-dot"></span>
          </button>
        </div>

        <div class="btn-row">
          <button type="button" class="btn btn-main" style="width:100%; padding:13px; font-size:15px;" onclick="openPaymentStage()">
            Tölege Geç
          </button>
        </div>
      </div>

      <!-- Adım 2: Seçilen Ödeme Ekranı -->
      <div id="payment-stage" class="checkout-panel" style="display:none;"></div>
    </div>

    <div class="panel">
      <h3>Taryh (Bakiýe Ýatyrmalar)</h3>
      <div id="my-deposits-list"></div>
    </div>
  </main>

  <script src="assets/tkm.js"></script>
  <script>
    mountPlayerokShell("profile", "", true);

    const TMT_PER_USDT = 20;
    const BSC_USDT_CONTRACT = "0x55d398326f99059ff775485246999027b3197955";
    const TRON_USDT_CONTRACT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
    const BSCSCAN_API_KEY = "";

    const MY_WALLETS = {
      usdt_bep20: {
        label: "USDT BEP20",
        chain: "BNB Smart Chain (BSC)",
        addr: "0x4589c99db18e63938b565731f9b60267ce9d2c5d",
        warn: "Serişdeleri diňe BSC (BEP20) ulgamy arkaly görkezilen salgya iberiň."
      },
      usdt_trc20: {
        label: "USDT TRC20",
        chain: "TRON Mainnet",
        addr: "TD9LPTXx9YdksJGmwqYiEh576o7FF67DUt",
        warn: "Serişdeleri diňe TRON (TRC20) ulgamy arkaly görkezilen salgya iberiň."
      },
      btc: {
        label: "Bitcoin (BTC)",
        chain: "Bitcoin Mainnet",
        addr: "16LxjLMXRNaijHiCf4MwsvgcaMxAoambT1",
        warn: "Serişdeleri diňe Bitcoin ulgamy arkaly görkezilen salgya iberiň."
      }
    };

    let payGroup = "crypto";
    let activeNet = "usdt_bep20";
    let btcUsdPrice = 95000;
    let countdownSec = 1200;
    let timerInterval = null;

    async function loadBtcPrice() {
      try {
        const res = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd");
        const data = await res.json();
        if (data?.bitcoin?.usd) btcUsdPrice = Number(data.bitcoin.usd);
      } catch (_) {}
    }

    function pickAmt(val, btn) {
      document.getElementById("dep-amount").value = val;
      document.querySelectorAll(".preset-chip").forEach(b => b.classList.remove("active"));
      if (btn) btn.classList.add("active");
      if (document.getElementById("payment-stage").style.display === "block") {
        renderPaymentStage();
      }
    }

    function choosePayGroup(group) {
      payGroup = group;
      document.querySelectorAll(".pay-method-item").forEach(item => {
        const isSel = item.dataset.pay === group;
        item.classList.toggle("active", isSel);
        item.querySelector(".radio-dot").textContent = isSel ? "✓" : "";
      });
    }

    function calcCryptoAmount(tmt, net) {
      const usd = tmt / TMT_PER_USDT;
      if (net === "btc") return { amount: Number((usd / btcUsdPrice).toFixed(6)), unit: "BTC" };
      return { amount: Number(usd.toFixed(2)), unit: "USDT" };
    }

    function formatTimer(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      return `${m}:${s}`;
    }

    function startPaymentTimer() {
      clearInterval(timerInterval);
      countdownSec = 1200;
      timerInterval = setInterval(() => {
        countdownSec = Math.max(0, countdownSec - 1);
        const el = document.getElementById("pay-timer-txt");
        if (el) el.textContent = formatTimer(countdownSec);
      }, 1000);
    }

    function openPaymentStage() {
      const amt = Number(document.getElementById("dep-amount").value || 0);
      if (!amt || amt <= 0) {
        showToast("Ýatyrmak möçberini giriziň!");
        return;
      }
      document.getElementById("payment-stage").style.display = "block";
      startPaymentTimer();
      renderPaymentStage();
      document.getElementById("payment-stage").scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function selectCryptoNet(net) {
      activeNet = net;
      renderPaymentStage();
    }

    function renderPaymentStage() {
      const stage = document.getElementById("payment-stage");
      const amt = Math.max(1, Number(document.getElementById("dep-amount").value || 100));

      if (payGroup === "card") {
        stage.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong style="font-size:16px;">💳 Kart Maglumatlary</strong>
            <span class="badge-status" id="pay-timer-txt">${formatTimer(countdownSec)}</span>
          </div>
          <div style="font-size:20px; font-weight:900; margin-top:6px;">${amt.toLocaleString()} TMT</div>

          <div class="field" style="margin-top:10px;">
            <label>Kart Belgisi</label>
            <input id="inp-card-num" type="text" inputmode="numeric" maxlength="19" placeholder="1234 1234 1234 1234" />
          </div>
          <div class="card-grid-2">
            <div class="field">
              <label>AA / ÝÝ</label>
              <input id="inp-card-exp" type="text" maxlength="5" placeholder="AA / ÝÝ" />
            </div>
            <div class="field">
              <label>CVC</label>
              <input id="inp-card-cvc" type="password" inputmode="numeric" maxlength="4" placeholder="CVC" />
            </div>
          </div>
          <div class="field" style="margin-top:10px;">
            <label>Kartdaky Ad</label>
            <input id="inp-card-name" type="text" placeholder="AD FAMILÝA" />
          </div>
          <div class="btn-row">
            <button type="button" class="btn btn-green" style="width:100%; padding:13px;" onclick="submitCardDeposit(${amt})">
              Töle (${amt.toLocaleString()} TMT)
            </button>
          </div>
        `;
        return;
      }

      const conv = calcCryptoAmount(amt, activeNet);
      const wInfo = MY_WALLETS[activeNet];

      stage.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <strong style="font-size:16px;">⛓️ Töleg — ${amt.toLocaleString()} TMT</strong>
          <span class="badge-status" id="pay-timer-txt">${formatTimer(countdownSec)}</span>
        </div>

        <div class="net-pills">
          <button type="button" class="net-pill ${activeNet === "usdt_bep20" ? "active" : ""}" onclick="selectCryptoNet('usdt_bep20')">USDT BEP20</button>
          <button type="button" class="net-pill ${activeNet === "usdt_trc20" ? "active" : ""}" onclick="selectCryptoNet('usdt_trc20')">USDT TRC20</button>
          <button type="button" class="net-pill ${activeNet === "btc" ? "active" : ""}" onclick="selectCryptoNet('btc')">Bitcoin (BTC)</button>
        </div>

        <div class="addr-copy-box">
          <div>
            <div style="font-size:18px; font-weight:900;">${conv.amount} ${conv.unit}</div>
            <div class="muted">${wInfo.chain} · ≈ ${amt.toLocaleString()} TMT</div>
          </div>
          <button type="button" class="btn btn-soft" onclick="copyText('${conv.amount}')">Mukdary Göçür</button>
        </div>

        <div class="muted" style="margin-top:10px;">${wInfo.warn}</div>

        <div class="addr-copy-box">
          <code id="wallet-addr-code" style="font-size:12px;">${wInfo.addr}</code>
          <button type="button" class="btn btn-soft" onclick="copyText('${wInfo.addr}')">Göçür</button>
        </div>

        <div style="margin-top:12px; padding:10px; border-radius:12px; text-align:center; font-weight:800; background:rgba(245,158,11,0.15); color:#fcd34d;">
          ⏳ Töleg garaşylýar — salgyňa pul düşenden soň barlaň
        </div>

        <div class="btn-row">
          <button type="button" id="check-chain-btn" class="btn btn-green" style="width:100%; padding:13px;" onclick="submitCryptoDeposit(${amt}, '${activeNet}', ${conv.amount}, '${conv.unit}')">
            Tölegi Barla we Bakiýä Goş
          </button>
        </div>
      `;
    }

    function copyText(str) {
      if (navigator.clipboard && str) navigator.clipboard.writeText(str).catch(() => {});
      showToast("Göçürildi!");
    }

    function getUsedTxHashes() {
      try { return JSON.parse(localStorage.getItem("tkm_used_tx_hashes") || "[]"); }
      catch (_) { return []; }
    }

    function markTxHashUsed(hash) {
      if (!hash) return;
      const used = getUsedTxHashes();
      if (!used.includes(hash)) {
        used.push(hash);
        localStorage.setItem("tkm_used_tx_hashes", JSON.stringify(used));
      }
    }

    async function verifyIncomingBep20(walletAddr, minUsdt) {
      const used = getUsedTxHashes();
      const keyPart = BSCSCAN_API_KEY ? `&apikey=${encodeURIComponent(BSCSCAN_API_KEY)}` : "";
      const url = `https://api.bscscan.com/api?module=account&action=tokentx&contractaddress=${BSC_USDT_CONTRACT}&address=${encodeURIComponent(walletAddr)}&page=1&offset=20&sort=desc${keyPart}`;
      const res = await fetch(url);
      const data = await res.json();
      if (data.status !== "1" || !Array.isArray(data.result)) return null;

      const nowSec = Math.floor(Date.now() / 1000);
      for (const tx of data.result) {
        const toAddr = String(tx.to || "").toLowerCase();
        const txHash = String(tx.hash || "");
        const decimals = Number(tx.tokenDecimal || 18);
        const valUsdt = Number(tx.value || 0) / Math.pow(10, decimals);
        const ageSec = nowSec - Number(tx.timeStamp || 0);
        if (toAddr !== walletAddr.toLowerCase()) continue;
        if (used.includes(txHash)) continue;
        if (ageSec > 10800) continue;
        if (valUsdt + 0.05 < minUsdt) continue;
        return txHash;
      }
      return null;
    }

    async function verifyIncomingTrc20(walletAddr, minUsdt) {
      const used = getUsedTxHashes();
      const url = `https://api.trongrid.io/v1/accounts/${encodeURIComponent(walletAddr)}/transactions/trc20?only_confirmed=true&only_to=true&limit=20&contract_address=${TRON_USDT_CONTRACT}`;
      const res = await fetch(url);
      const data = await res.json();
      if (!Array.isArray(data.data)) return null;

      const nowMs = Date.now();
      for (const tx of data.data) {
        const txHash = String(tx.transaction_id || "");
        const decimals = Number(tx.token_info?.decimals || 6);
        const valUsdt = Number(tx.value || 0) / Math.pow(10, decimals);
        const ageMs = nowMs - Number(tx.block_timestamp || 0);
        if (used.includes(txHash)) continue;
        if (ageMs > 10800 * 1000) continue;
        if (valUsdt + 0.05 < minUsdt) continue;
        return txHash;
      }
      return null;
    }

    async function verifyIncomingBtc(walletAddr, minBtc) {
      const used = getUsedTxHashes();
      const res = await fetch(`https://mempool.space/api/address/${encodeURIComponent(walletAddr)}/txs`);
      const txs = await res.json();
      if (!Array.isArray(txs)) return null;

      for (const tx of txs.slice(0, 20)) {
        const txHash = String(tx.txid || "");
        if (used.includes(txHash)) continue;
        let sats = 0;
        for (const vout of (tx.vout || [])) {
          if (vout.scriptpubkey_address === walletAddr) sats += Number(vout.value || 0);
        }
        if ((sats / 1e8) + 0.000005 < minBtc) continue;
        return txHash;
      }
      return null;
    }

    async function saveDepositRecord(payload) {
      let saved = null;
      try { saved = await sbInsert("deposits", payload); }
      catch (_) { saved = { id: "dep-" + Date.now(), ...payload }; }

      let cache = [];
      try { cache = JSON.parse(localStorage.getItem("tkm_deposits_cache") || "[]"); } catch (__) {}
      cache.unshift(saved);
      localStorage.setItem("tkm_deposits_cache", JSON.stringify(cache));
      await refreshWalletAndList();
    }

    async function submitCryptoDeposit(amountTmt, net, cryptoAmt, unit) {
      if (!requireVerifiedUser("profil.html")) return;
      const user = getUser();
      const wInfo = MY_WALLETS[net];
      const btn = document.getElementById("check-chain-btn");
      btn.disabled = true;
      btn.textContent = "⏳ Blockchain barlanýar...";

      let txHash = null;
      try {
        if (net === "usdt_bep20") txHash = await verifyIncomingBep20(wInfo.addr, cryptoAmt);
        else if (net === "usdt_trc20") txHash = await verifyIncomingTrc20(wInfo.addr, cryptoAmt);
        else if (net === "btc") txHash = await verifyIncomingBtc(wInfo.addr, cryptoAmt);
      } catch (_) { txHash = null; }
      finally {
        btn.disabled = false;
        btn.textContent = "Tölegi Barla we Bakiýä Goş";
      }

      if (!txHash) {
        showToast("Salgyňa heniz töleg düşmedik — pul geçenden soň täzeden basyň!");
        return;
      }

      markTxHashUsed(txHash);
      await saveDepositRecord({
        username: user.username,
        amount_tmt: amountTmt,
        method: net.toUpperCase(),
        reference_info: `${cryptoAmt} ${unit} · TX: ${txHash}`,
        status: "approved"
      });
      showToast(`+${amountTmt.toLocaleString()} TMT bakiýä goşuldy ✅`);
    }

    async function submitCardDeposit(amountTmt) {
      if (!requireVerifiedUser("profil.html")) return;
      const user = getUser();
      const num = (document.getElementById("inp-card-num")?.value || "").replace(/\s+/g, "");
      const exp = (document.getElementById("inp-card-exp")?.value || "").trim();
      const cvc = (document.getElementById("inp-card-cvc")?.value || "").trim();
      const holder = (document.getElementById("inp-card-name")?.value || "").trim();

      if (num.length < 12 || !exp || cvc.length < 3 || !holder) {
        showToast("Kart maglumatlaryny doly giriziň!");
        return;
      }

      await saveDepositRecord({
        username: user.username,
        amount_tmt: amountTmt,
        method: "CARD",
        reference_info: `Kart •••• ${num.slice(-4)} (${holder})`,
        status: "approved"
      });
      showToast(`+${amountTmt.toLocaleString()} TMT bakiýä goşuldy ✅`);
    }

    async function refreshWalletAndList() {
      await refreshTopBalancePill();
      const pillTxt = document.getElementById("top-balance-pill")?.textContent || "💰 0 TMT";
      document.getElementById("dep-cur-bal").textContent = pillTxt.replace("💰 ", "");

      const user = getUser();
      let list = [];
      try {
        list = await sbGet("deposits");
        localStorage.setItem("tkm_deposits_cache", JSON.stringify(list));
      } catch (_) {
        try { list = JSON.parse(localStorage.getItem("tkm_deposits_cache") || "[]"); } catch (__) {}
      }

      const mine = user.loggedIn
        ? list.filter(x => String(x.username || "").toLowerCase() === String(user.username || "").toLowerCase())
        : list.slice(0, 10);

      const wrap = document.getElementById("my-deposits-list");
      if (!mine.length) {
        wrap.innerHTML = `<p class="muted">Heniz töleg taryhy ýok.</p>`;
        return;
      }

      wrap.innerHTML = mine.map(d => `
        <div class="list-row">
          <div>
            <strong>+${Number(d.amount_tmt || 0).toLocaleString()} TMT</strong> — <span class="chip-cat">${esc(d.method)}</span>
            <div class="muted" style="word-break:break-all;">${esc(d.reference_info || "")}</div>
          </div>
          <span class="badge-status ok">Üstünlikli ✅</span>
        </div>
      `).join("");
    }

    loadBtcPrice();
    refreshWalletAndList();
  </script>
</body>
</html>
