<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TKM Market — Dil &amp; Para Birimi</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="tkm-core.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 50% 0%, #1d294d 0%, #0b0f1d 58%, #070a14 100%);
      color: #f8fafc; min-height: 100vh; padding: 14px 14px 86px;
    }
    .container { max-width: 560px; margin: 0 auto; }
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px; border-radius: 14px; background: #141b30;
      border: 1px solid rgba(148,163,184,.16); margin-bottom: 12px;
    }
    .topbar a { color: #93c5fd; text-decoration: none; font-weight: 800; font-size: 13px; }
    .card {
      background: #141b30; border: 1px solid rgba(148,163,184,.16);
      border-radius: 16px; padding: 16px; margin-bottom: 12px;
    }
    .opt-btn {
      width: 100%; display: flex; justify-content: space-between; align-items: center;
      padding: 14px; border-radius: 12px; border: 1px solid rgba(148,163,184,.2);
      background: #1b2440; color: #fff; font-size: 14px; font-weight: 800;
      cursor: pointer; margin-bottom: 10px; text-align: left;
    }
    .opt-btn.active { border-color: #60a5fa; background: linear-gradient(135deg, #3b6ef6, #5b4df5); }
    .preview-box {
      background: #0d1324; border: 1px solid rgba(148,163,184,.16);
      border-radius: 12px; padding: 13px; font-size: 13px; margin-top: 8px;
    }
    .bottom-nav {
      position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr);
      background: rgba(15, 21, 38, 0.97); border-top: 1px solid rgba(148,163,184,.16); padding: 8px 4px;
    }
    .bottom-nav a { text-decoration: none; color: #94a3b8; text-align: center; font-size: 11px; font-weight: 700; }
    .bottom-nav a.active { color: #60a5fa; }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <a href="profil.html">← Profil</a>
      <div id="headerRightControls"></div>
    </div>

    <div class="card">
      <h2 style="margin:0 0 12px;font-size:16px;" data-i18n="langCurrency">Dil &amp; Para Birimi</h2>

      <button type="button" class="opt-btn" id="btn-tk" onclick="choose('tk')">
        <span>🇹🇲 Türkmençe</span>
        <span>TMT (Manat)</span>
      </button>

      <button type="button" class="opt-btn" id="btn-ru" onclick="choose('ru')">
        <span>🇷🇺 Русский</span>
        <span>RUB (₽)</span>
      </button>

      <button type="button" class="opt-btn" id="btn-en" onclick="choose('en')">
        <span>🇺🇸 English</span>
        <span>USD ($)</span>
      </button>

      <div class="preview-box" id="previewText"></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" data-i18n="home">Ana Sayfa</a>
    <a href="index.html#ilan-pazari" data-i18n="market">İlan Pazarı</a>
    <a href="index.html#kategoriler" data-i18n="categories">Kategoriler</a>
    <a href="bakiye-yatir.html" data-i18n="wallet">Cüzdan</a>
    <a href="profil.html" class="active" data-i18n="profile">Profil</a>
  </nav>

  <script>
    function refreshUi() {
      const code = tkmGetLocale();
      ["tk", "ru", "en"].forEach(c => {
        document.getElementById("btn-" + c).classList.toggle("active", c === code);
      });
      document.getElementById("previewText").innerHTML =
        `Aktif Sistem: <strong>${TKM_LOCALE_CONFIG[code].label}</strong><br>` +
        `Örnek Tutar (100 TMT baz): <strong>${tkmFmtMoney(100)}</strong>`;
    }

    function choose(code) {
      tkmSetLocale(code);
      refreshUi();
    }

    refreshUi();
  </script>
</body>
</html>
