<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TKM Market — Sahip Kontrol Merkezi</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #090d16; color: #f1f5f9; padding: 16px; }
    h1 { font-size: 20px; color: #38bdf8; margin-bottom: 16px; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
    .card { background: #111827; border: 1px solid #1e293b; border-radius: 12px; padding: 14px; }
    .card span { font-size: 12px; color: #94a3b8; display: block; }
    .card strong { font-size: 22px; color: #22c55e; margin-top: 4px; display: block; }
    .card.warn strong { color: #f59e0b; }
    .card.blue strong { color: #38bdf8; }
    .box { background: #111827; border: 1px solid #1e293b; border-radius: 12px; padding: 14px; margin-bottom: 16px; overflow-x: auto; }
    h2 { font-size: 15px; margin: 0 0 10px; color: #e2e8f0; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #1e293b; }
    th { color: #94a3b8; }
    .badge { padding: 2px 6px; border-radius: 6px; font-size: 11px; background: #1e293b; }
    .in { color: #22c55e; } .out { color: #f87171; }
    button { background: #2563eb; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <h1>TKM Market — Sahip Kontrol Merkezi</h1>
    <button onclick="loadDashboard()">Yenile</button>
  </div>
  <p id="status" style="font-size:13px; color:#94a3b8;">Yetki kontrol ediliyor...</p>

  <div class="grid" id="stats" style="display:none;">
    <div class="card blue"><span>Şu An Aktif (Son 5 Dk)</span><strong id="liveUsers">0</strong></div>
    <div class="card blue"><span>Bugün Tekil Ziyaretçi</span><strong id="todayVisitors">0</strong></div>
    <div class="card"><span>Toplam Onaylı Yatırım</span><strong id="totalDeposits">$0.00</strong></div>
    <div class="card warn"><span>Bekleyen Çekim Talebi</span><strong id="pendingWithdraws">0</strong></div>
    <div class="card"><span>Kasadaki Üye Bakiyesi</span><strong id="totalBalance">$0.00</strong></div>
    <div class="card blue"><span>Toplam Kayıtlı Üye</span><strong id="totalUsers">0</strong></div>
  </div>

  <div class="box" id="eventsBox" style="display:none;">
    <h2>Canlı Site Akışı (Giriş / Çıkış / Süre)</h2>
    <table>
      <thead>
        <tr><th>Saat</th><th>İşlem</th><th>Sayfa</th><th>Süre</th><th>Cihaz</th><th>Oturum</th></tr>
      </thead>
      <tbody id="eventsBody"></tbody>
    </table>
  </div>

  <script>
    const SUPABASE_URL = "https://piajbopfeqlyupkrsnik.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_gQFoj3SUxW-TUMjYmTGrIg_5_6hwBAH";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadDashboard() {
      const statusEl = document.getElementById("status");
      const { data: { user } } = await sb.auth.getUser();

      if (!user) {
        statusEl.innerText = "Erişim reddedildi: Önce siteye admin hesabınla giriş yap.";
        return;
      }

      const { data: profile } = await sb.from("profiles").select("role").eq("id", user.id).single();
      if (!profile || profile.role !== "admin") {
        statusEl.innerText = "Yetkisiz hesap: Bu panel sadece site sahibine açıktır.";
        return;
      }

      statusEl.innerText = "Canlı veriler aktif (" + new Date().toLocaleTimeString("tr-TR") + ")";
      document.getElementById("stats").style.display = "grid";
      document.getElementById("eventsBox").style.display = "block";

      const fiveMinAgo = new Date(Date.now() - 5 * 60 * 1000).toISOString();
      const todayStart = new Date(); todayStart.setHours(0, 0, 0, 0);

      const { data: events } = await sb
        .from("site_events")
        .select("*")
        .order("created_at", { ascending: false })
        .limit(40);

      if (events) {
        const liveSessions = new Set(events.filter(e => e.created_at >= fiveMinAgo).map(e => e.session_id));
        const todaySessions = new Set(events.filter(e => e.created_at >= todayStart.toISOString()).map(e => e.session_id));
        document.getElementById("liveUsers").innerText = liveSessions.size;
        document.getElementById("todayVisitors").innerText = todaySessions.size;

        const tbody = document.getElementById("eventsBody");
        tbody.innerHTML = events.map(e => {
          const time = new Date(e.created_at).toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
          const cls = e.event_type === "page_leave" ? "out" : "in";
          const label = e.event_type === "page_view" ? "Giriş" : e.event_type === "page_leave" ? "Çıkış" : e.event_type;
          return `<tr>
            <td>${time}</td>
            <td><span class="badge ${cls}">${label}</span></td>
            <td>${e.page_path}</td>
            <td>${e.duration_sec ? e.duration_sec + " sn" : "-"}</td>
            <td>${e.device_type || "-"}</td>
            <td>${e.session_id.slice(4, 10)}</td>
          </tr>`;
        }).join("");
      }

      const { data: profiles } = await sb.from("profiles").select("balance");
      if (profiles) {
        document.getElementById("totalUsers").innerText = profiles.length;
        const sumBal = profiles.reduce((acc, p) => acc + Number(p.balance || 0), 0);
        document.getElementById("totalBalance").innerText = "$" + sumBal.toFixed(2);
      }

      const { data: deps } = await sb.from("deposits").select("amount, status");
      if (deps) {
        const approvedSum = deps
          .filter(d => ["completed", "finished", "paid", "approved"].includes((d.status || "").toLowerCase()))
          .reduce((acc, d) => acc + Number(d.amount || 0), 0);
        document.getElementById("totalDeposits").innerText = "$" + approvedSum.toFixed(2);
      }

      const { data: withs } = await sb.from("withdrawals").select("id, status").eq("status", "pending");
      if (withs) {
        document.getElementById("pendingWithdraws").innerText = withs.length;
      }
    }

    loadDashboard();
    setInterval(loadDashboard, 15000);
  </script>
</body>
</html>
