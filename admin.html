<!DOCTYPE html>
<html lang="tk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Paneli — TKM Market</title>
  <link rel="stylesheet" href="assets/tkm.css" />
  <style>
    .admin-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
    @media (max-width: 600px) { .admin-tabs { grid-template-columns: 1fr; } }
    .admin-tab {
      padding: 11px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-weight: 800;
      cursor: pointer;
    }
    .admin-tab.active {
      border-color: #a855f7;
      background: rgba(168, 85, 247, 0.2);
      color: #f0abfc;
    }
    .wallet-ref-box {
      padding: 12px;
      border-radius: 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      margin-bottom: 12px;
      font-size: 13px;
    }
    .action-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .tx-inline-input {
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
      min-width: 180px;
    }
  </style>
</head>
<body>
  <div id="playerok-shell"></div>

  <main class="page-wrap">
    <div class="panel">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;">
        <div>
          <h2>🛡️ Dolandyryş Paneli (Blockchain)</h2>
          <p class="muted">USDT BEP20, USDT TRC20 we BTC yatırma hem-de çekiş amallaryny dolandyryň.</p>
        </div>
        <button type="button" class="btn btn-soft" onclick="reloadAdminData()">🔄 Täzele</button>
      </div>

      <div class="wallet-ref-box" style="margin-top:12px;">
        <div><strong>USDT BEP20:</strong> <code>0x4589c99db18e63938b565731f9b60267ce9d2c5d</code></div>
        <div style="margin-top:4px;"><strong>USDT TRC20:</strong> <code>TD9LPTXx9YdksJGmwqYiEh576o7FF67DUt</code></div>
        <div style="margin-top:4px;"><strong>Bitcoin (BTC):</strong> <code>16LxjLMXRNaijHiCf4MwsvgcaMxAoambT1</code></div>
      </div>

      <div class="admin-tabs">
        <button type="button" class="admin-tab active" id="tab-deposits" onclick="switchAdminTab('deposits')">
          ⛓️ Bakiýe Ýatyrmalar (<span id="cnt-dep">0</span>)
        </button>
        <button type="button" class="admin-tab" id="tab-withdrawals" onclick="switchAdminTab('withdrawals')">
          💸 Pul Çekişler (<span id="cnt-wd">0</span>)
        </button>
        <button type="button" class="admin-tab" id="tab-users" onclick="switchAdminTab('users')">
          👥 Ulanyjylar (<span id="cnt-usr">0</span>)
        </button>
      </div>

      <div id="sec-deposits"></div>
      <div id="sec-withdrawals" style="display:none;"></div>
      <div id="sec-users" style="display:none;"></div>
    </div>
  </main>

  <script src="assets/tkm.js"></script>
  <script>
    mountPlayerokShell("profile", "", true);

    let activeTab = "deposits";
    let depositsList = [];
    let withdrawalsList = [];

    function switchAdminTab(tab) {
      activeTab = tab;
      document.getElementById("tab-deposits").classList.toggle("active", tab === "deposits");
      document.getElementById("tab-withdrawals").classList.toggle("active", tab === "withdrawals");
      document.getElementById("tab-users").classList.toggle("active", tab === "users");

      document.getElementById("sec-deposits").style.display = tab === "deposits" ? "block" : "none";
      document.getElementById("sec-withdrawals").style.display = tab === "withdrawals" ? "block" : "none";
      document.getElementById("sec-users").style.display = tab === "users" ? "block" : "none";
    }

    function readLocalCache(key) {
      try { return JSON.parse(localStorage.getItem(key) || "[]"); }
      catch (_) { return []; }
    }

    function writeLocalCache(key, arr) {
      localStorage.setItem(key, JSON.stringify(arr));
    }

    async function reloadAdminData() {
      try {
        depositsList = await sbGet("deposits");
        writeLocalCache("tkm_deposits_cache", depositsList);
      } catch (_) {
        depositsList = readLocalCache("tkm_deposits_cache");
      }

      try {
        withdrawalsList = await sbGet("withdrawals");
        writeLocalCache("tkm_withdrawals_cache", withdrawalsList);
      } catch (_) {
        withdrawalsList = readLocalCache("tkm_withdrawals_cache");
      }

      document.getElementById("cnt-dep").textContent = depositsList.length;
      document.getElementById("cnt-wd").textContent = withdrawalsList.length;

      let usersObj = {};
      try { usersObj = JSON.parse(localStorage.getItem("tkm_users_registry") || "{}"); } catch (_) {}
      const usersArr = Object.values(usersObj);
      document.getElementById("cnt-usr").textContent = usersArr.length;

      renderDepositsAdmin();
      renderWithdrawalsAdmin();
      renderUsersAdmin(usersArr);
      await refreshTopBalancePill();
    }

    async function updateDepositStatus(id, newStatus) {
      const target = depositsList.find(x => String(x.id) === String(id));
      if (!target) return;

      target.status = newStatus;
      writeLocalCache("tkm_deposits_cache", depositsList);

      if (typeof sbPatch === "function") {
        try { await sbPatch("deposits", id, { status: newStatus }); } catch (_) {}
      }

      showToast(newStatus === "approved" ? "Ýatyryş tassyklanyldy ✅" : "Ýatyryş ret edildi ❌");
      renderDepositsAdmin();
      await refreshTopBalancePill();
    }

    async function updateWithdrawalStatus(id, newStatus) {
      const target = withdrawalsList.find(x => String(x.id) === String(id));
      if (!target) return;

      const txInput = document.getElementById(`tx-wd-${id}`);
      const txVal = (txInput?.value || "").trim();

      target.status = newStatus;
      if (txVal) {
        target.tx_hash = txVal;
        target.network_or_coin = `${target.network_or_coin || target.method} · TX: ${txVal.slice(0, 14)}...`;
      }
      writeLocalCache("tkm_withdrawals_cache", withdrawalsList);

      if (typeof sbPatch === "function") {
        try {
          const patchBody = { status: newStatus };
          if (txVal) patchBody.tx_hash = txVal;
          await sbPatch("withdrawals", id, patchBody);
        } catch (_) {}
      }

      showToast(newStatus === "approved" ? "Çekiş tassyklanyldy ✅" : "Çekiş ret edildi ❌");
      renderWithdrawalsAdmin();
      await refreshTopBalancePill();
    }

    function renderDepositsAdmin() {
      const wrap = document.getElementById("sec-deposits");
      if (!depositsList.length) {
        wrap.innerHTML = `<p class="muted">Bakiýe ýatyryş ýazgysy ýok.</p>`;
        return;
      }

      wrap.innerHTML = depositsList.map(d => {
        const isApproved = d.status === "approved";
        const isRejected = d.status === "rejected";
        const badgeLabel = isRejected ? "Ret Edildi ❌" : (isApproved ? "Tassyklanyldy ✅" : "Garaşylýar ⏳");
        const badgeCls = isApproved ? "badge-status ok" : "badge-status";

        return `
          <div class="list-row" style="flex-direction:column; align-items:stretch;">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;">
              <div>
                <strong>${esc(d.username || "Ulanyjy")}</strong> —
                <strong style="color:#34d399;">+${Number(d.amount_tmt || 0).toLocaleString()} TMT</strong>
                <span class="chip-cat">${esc(d.method || "CRYPTO")}</span>
                <div class="muted" style="word-break:break-all; margin-top:4px;">${esc(d.reference_info || "")}</div>
              </div>
              <span class="${badgeCls}">${badgeLabel}</span>
            </div>
            <div class="action-btns">
              <button type="button" class="btn btn-green" onclick="updateDepositStatus('${d.id}', 'approved')">Tassyklamak ✅</button>
              <button type="button" class="btn btn-del" onclick="updateDepositStatus('${d.id}', 'rejected')">Ret Etmek ❌</button>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderWithdrawalsAdmin() {
      const wrap = document.getElementById("sec-withdrawals");
      if (!withdrawalsList.length) {
        wrap.innerHTML = `<p class="muted">Çekiş islegi ýok.</p>`;
        return;
      }

      wrap.innerHTML = withdrawalsList.map(w => {
        const isApproved = w.status === "approved";
        const isRejected = w.status === "rejected";
        const badgeLabel = isApproved ? "Tassyklanyldy ✅" : (isRejected ? "Ret Edildi ❌" : "Garaşylýar ⏳");
        const badgeCls = isApproved ? "badge-status ok" : "badge-status";

        return `
          <div class="list-row" style="flex-direction:column; align-items:stretch;">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;">
              <div>
                <strong>${esc(w.seller || "Ulanyjy")}</strong> —
                <strong style="color:#f472b6;">${Number(w.amount_tmt || 0).toLocaleString()} TMT</strong>
                <span class="chip-cat">${esc(w.network_or_coin || w.method || "CRYPTO")}</span>
                <div class="muted" style="word-break:break-all; margin-top:4px;">Salgy: <code>${esc(w.wallet_or_card || "")}</code></div>
              </div>
              <span class="${badgeCls}">${badgeLabel}</span>
            </div>
            <div class="action-btns">
              <input id="tx-wd-${w.id}" class="tx-inline-input" type="text" placeholder="TX Hash giriziň (isteğe bağlı)" value="${esc(w.tx_hash || "")}" />
              <button type="button" class="btn btn-green" onclick="updateWithdrawalStatus('${w.id}', 'approved')">Ugradyldy / Tassyklamak ✅</button>
              <button type="button" class="btn btn-del" onclick="updateWithdrawalStatus('${w.id}', 'rejected')">Ret Etmek ❌</button>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderUsersAdmin(usersArr) {
      const wrap = document.getElementById("sec-users");
      if (!usersArr.length) {
        wrap.innerHTML = `<p class="muted">Kayıtly ulanyjy tapylmady.</p>`;
        return;
      }

      wrap.innerHTML = usersArr.map(u => `
        <div class="list-row">
          <div>
            <strong>${esc(u.username || "-")}</strong> <span class="chip-cat">${esc(u.role || "buyer")}</span>
            <div class="muted">E-poçta: ${esc(u.email || "-")} · Ýeri: ${esc(u.address || "-")}</div>
          </div>
          <span class="badge-status ok">Tassyklanan ✅</span>
        </div>
      `).join("");
    }

    reloadAdminData();
  </script>
</body>
</html>
