<!DOCTYPE html>
<html lang="tk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ähli Kategorýalar — TKM Market</title>
  <link rel="stylesheet" href="assets/tkm.css" />
</head>
<body>
  <div id="playerok-shell"></div>

  <main class="page-wrap">
    <div class="sec-header">
      <h2>Oýunlar</h2>
      <span class="muted">11 oýun</span>
    </div>
    <div class="app-grid-4" id="games-grid-4"></div>

    <div class="sec-header">
      <h2>Programmalar &amp; Sanly Hyzmatlar</h2>
      <span class="muted">19 programma</span>
    </div>
    <div class="app-grid-4" id="apps-grid-4"></div>

    <div class="sec-header">
      <h2>Trading Kurs</h2>
      <span class="muted">Okuw</span>
    </div>
    <div class="app-grid-4" id="courses-grid-4"></div>
  </main>

  <script src="assets/tkm.js"></script>
  <script>
    mountPlayerokShell("catalog", "Oýun ýa-da programma gözle...", true);

    function renderSquareGrid(targetId, items, filterQ = "") {
      const el = document.getElementById(targetId);
      const q = filterQ.trim().toLowerCase();
      const matched = items.filter(x => !q || x.name.toLowerCase().includes(q));

      el.innerHTML = matched.map(item => `
        <button class="app-tile" type="button" onclick="location.href='uygulama.html?slug=${encodeURIComponent(item.id)}'">
          <div class="app-icon-box">${renderPlatformLogoImg(item)}</div>
          <span>${esc(item.name)}</span>
        </button>
      `).join("");
    }

    function paintGrids() {
      const q = document.getElementById("global-search")?.value || "";
      renderSquareGrid("games-grid-4", GAMES_CATALOG, q);
      renderSquareGrid("apps-grid-4", APPS_CATALOG, q);
      renderSquareGrid("courses-grid-4", COURSES_CATALOG, q);
    }

    document.getElementById("global-search")?.addEventListener("input", paintGrids);
    paintGrids();
  </script>
</body>
</html>
